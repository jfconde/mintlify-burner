# Vale configuration — style & grammar checks for the docs/ content.
# https://vale.sh/docs/topics/config/
StylesPath = .github/styles
MinAlertLevel = suggestion
Vocab = Docs

# Style packages, fetched into StylesPath by `vale sync` (the CI action does
# this automatically). See https://vale.sh/hub for the full catalog.
#   - Vale        bundled core checks (spelling, repetition, ...)
#   - Google      Google developer documentation style guide
#   - write-good  general prose/grammar linter
#   - MDX         teaches Vale to parse MDX syntax (JSX, imports/exports, ...)
Packages = Google, write-good, MDX

# Treat .mdx the same as Markdown as a fallback in case the MDX package
# above isn't picked up for some reason.
[formats]
mdx = md

[docs/**/*.{md,mdx}]
BasedOnStyles = Vale, Google, write-good

# Our own product/technical vocabulary — see
# .github/styles/config/vocabularies/Docs/accept.txt — so brand and domain
# terms (Payrails, SDK, 3DS, ...) don't get flagged as misspellings.
Vale.Spelling = error
Vale.Repetition = error

Vale.Terms = warning
# Relax some of the Google style guide rules that are too strict for our existing docs.
Google.EmDash = warning
Google.Latin = warning
Google.Quotes = warning
Google.OptionalPlurals = warning
Google.Spacing = warning
Google.Exclamation = warning
Google.Units = warning
Google.Ordinal = warning
Google.LyHyphens = warning
Google.DateFormat = warning
write-good.ThereIs = warning
write-good.So = warning

# A few rules are noisier than useful for our docs; keep the rest of each
# style guide active.
Google.Headings = NO      # we don't enforce sentence-case headings
Google.We = NO            # "we/our" is fine for our docs' tone
write-good.E-Prime = NO   # too strict: flags almost every use of "is/are"
