                              type: string
                              format: date
                              description: The start interval for the report.
                            intervalEnd:
                              type: string
                              format: date
                              description: The end interval for the report.
                        status:
                          type: string
                          description: The status of the report run.
                          enum:
                            - pending
                            - successful
                            - failed
                        result:
                          type: object
                          description: If the report run is successful (i.e. status=successful), the details about the generated report file.
                          nullable: true
                          properties:
                            fileName:
                              type: string
                              description: The suitable name for saving the file to a filesystem. Containing the directory and the name of the file (without the file extension).
