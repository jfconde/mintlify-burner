openapi: 3.1.0
info:
  version: 1.3.15
  title: Payrails API Reference
  contact:
    name: Payrails
    url: https://www.payrails.com
    email: tech@payrails.com
  license:
    name: Payrails GmbH
    url: https://www.payrails.com/
  description: |
    ---
    Payrails provides a collection of APIs that enable you to process and manage payments. Our APIs accept and return JSON in the HTTP body, and return standard HTTP response codes. You can consume the APIs directly using your favorite HTTP/REST library.
servers:
  - url: https://api.staging.payrails.io
    description: Payrails environment.
security:
  - ApiKey: []
tags:
  - name: ReportRuns
    description: Operations to generate and retrieve report runs.
paths:
  /analytics/reportRuns:
    get:
      summary: Search & list report runs
      operationId: listReportRuns
      description: Fetch a list of report runs.
      security:
        - BearerToken:
            - reportruns:list
      tags:
        - ReportRuns
      parameters:
        - name: page[after]
          in: query
          description: Search collection items after that cursor.
          required: false
          schema:
            type: string
            description: Cursor for paging results.
          example: xk2h55zsy5
        - name: page[before]
          in: query
          description: Search collection items before that cursor.
          required: false
          schema:
            type: string
            description: Cursor for paging results.
          example: 9wkueqcavq
        - name: page[size]
          in: query
          description: Length of the collection to search.
          required: false
          schema:
            type: integer
            format: int32
          example: 20
        - name: filter[workspaceId]
          in: query
          description: Filter by Workspace ID.
          schema:
            type: string
        - name: filter[reportCode]
          in: query
          description: Filter by Report Code.
          schema:
            type: string
            enum:
              - transaction_details
              - payments
              - settlements
              - transactions
              - disputes
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - links
                  - results
                properties:
                  links:
                    required:
                      - self
                    properties:
                      self:
                        type: string
                      prev:
                        type: string
                      next:
                        type: string
                      first:
                        type: string
                      last:
                        type: string
                  results:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - createdAt
                        - parameters
                        - status
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The unique identifier of the report run.
                        workspaceId:
                          type: string
                          format: uuid
                          description: Unique identifier of a workspace in Payrails.
                        createdAt:
                          type: string
                          format: date-time
                          description: Time at which the reportRun was created.
                        report:
                          type: object
                          required:
                            - id
                            - code
                            - name
                            - description
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: The unique identifier of the report.
                            code:
                              type: string
                              description: The unique code identifying the report.
                            name:
                              type: string
                              description: Human-readable name of the report.
                            description:
                              type: string
                              description: Description of the report.
                        parameters:
                          type: object
                          properties:
                            timezone:
                              type: string
                              description: Defaults to Etc/UTC. The output timezone for all timestamps in the report. A list of possible time zone values is maintained at the IANA Time Zone Database.
