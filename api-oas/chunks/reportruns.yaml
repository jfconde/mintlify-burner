                              type: string
                              description: The returned file type.
                              enum:
                                - csv
                            url:
                              type: string
                              description: The URL from which to download the file.
                            expiresAt:
                              type: string
                              format: date-time
                              description: The time at which the URL will expire and the file will no longer be accessible.
