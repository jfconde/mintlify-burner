openapi: 3.1.0
info:
  version: 1.3.15
  title: Payrails API Reference
  contact:
    name: Payrails
    url: https://www.payrails.com
    email: tech@payrails.com
  license:
    name: Payrails GmbH
    url: https://www.payrails.com/
  description: |
    ---
    Payrails provides a collection of APIs that enable you to process and manage payments. Our APIs accept and return JSON in the HTTP body, and return standard HTTP response codes. You can consume the APIs directly using your favorite HTTP/REST library.
servers:
  - url: https://api.staging.payrails.io
    description: Payrails environment.
security:
  - ApiKey: []
tags:
  - name: Vault Instant Proxy
    description: Operations related to Instant Proxy API requests.
paths:
  /payment/providers/{providerId}/proxy:
    post:
      tags:
        - Vault Instant Proxy
      summary: Execute an instant proxy request
      description: Executes a proxy request from our Vault to an external provider.
      operationId: vaultProxy
      security:
        - BearerToken:
            - providers:proxy
      parameters:
        - name: x-idempotency-key
          in: header
          description: |
            Idempotency key to be used.
            Sending again the same key would return the same result without re-executing the update.
          required: true
          schema:
            type: string
            format: uuid
          example: 91874e4d-81e9-4486-aee4-ee1de84da890
        - name: providerId
          in: path
          description: Identifier of the resource in Payrails.
          required: true
          schema:
            type: string
            format: uuid
          example: d5454c2f-ae5e-44f3-8edf-f6dad64f005f
        - name: Accept
          in: header
          description: Accept key indicates which content types the client is able to understand.
          required: true
          schema:
            type: string
          example: application/json
        - name: Content-Type
          in: header
          description: Content Type key to indicate the original media type of the resource.
          required: true
          schema:
            type: string
          example: application/json
        - name: Authorization
          in: header
          description: |
            Authorization header used to authenticate requests.
            Mandatory for payments via Checkout and send the bearer token from Checkout.
          required: false
          schema:
            type: string
          example: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - paymentInstrumentId
                - body
                - headers
                - url
              properties:
                paymentInstrumentId:
                  type: string
                  format: uuid
                  description: Payment Instrument that should be used.
                headers:
                  type: object
                  description: Headers that should be used for the request to the provider. The "Content-Type" header is required and must be passed exactly once.
                  additionalProperties: true
                url:
                  type: string
                  format: uri
                  description: URL address of the payment provider server to be called.
                body:
                  type: object
                  description: Body that should be used for the request to the provider.
                  additionalProperties: true
                encryptedSecurityCode:
                  type: string
                  description: |
                    Encrypted instrument security code replacing the security code from an earlier tokenization (if any).
                    The instrument security code should be encrypted with the RSA public key provided by Payrails SDK using JWE with encryption algorithm RSA-OAEP-256 and content encryption A256CBC-HS512.
                preProcessors:
                  type: array
                  description: Array of processors used when you need Payrails to make a customization in the request before forwarding it to the downstream destination, i.e. calculating a signature of body including sensitive data.
                  items:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Representation of a certain pre or post processor in Payrails.
                      parameters:
                        type: object
                        description: Parameters required for a certain pre or post processor in Payrails, refer to API guides for parameters of a specific processor.
                postProcessors:
                  type: array
                  description: Array of processors used when you need Payrails to make a customization in the response of the downstream destination before forwarding it to your system. i.e. redact any sensitive information in the response from a payment processor.
                  items:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Representation of a certain pre or post processor in Payrails.
                      parameters:
                        type: object
                        description: Parameters required for a certain pre or post processor in Payrails, refer to API guides for parameters of a specific processor.
            examples:
              adyen:
                description: Adyen.
                value:
                  paymentInstrumentId: eeaac45c-f032-49bc-a8c5-ec99d79b74e2
                  url: https://checkout-test.adyen.com/v69/payments
                  headers:
                    x-API-key: YOUR_API_KEY
                    Accept: application/json
                    Content-Type: application/json
                  body:
                    amount:
                      currency: USD
                      value: 1000
                    reference: your-order-number
                    paymentMethod:
                      type: scheme
                      number: '{{cardNumber}}'
                      expiryMonth: '{{cardExpiryMonth}}'
                      expiryYear: '{{cardExpiryYear}}'
                      holderName: '{{cardHolderName}}'
                      cvc: '{{cardSecurityCode}}'
                    returnUrl: https://your-company.com/...
                    merchantAccount: YOUR_MERCHANT_ACCOUNT
