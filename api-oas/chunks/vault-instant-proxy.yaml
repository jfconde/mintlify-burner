              pspWithSignatureCalculation:
                description: A PSP with signature calculation.
                value:
                  paymentInstrumentId: eeaac45c-f032-49bc-a8c5-ec99d79b74e2
                  url: https://api.somepsp.com/authorize
                  headers:
                    x-API-key: YOUR_API_KEY,
                    Content-Type: application/json
                    Signature: '{{requestHashSignature}}'
                  body:
                    amount:
                      currency: USD
                      value: 1000
                    reference: your-order-number
                    paymentMethod:
                      type: scheme
                      number: '{{cardNumber}}'
                      expiryMonth: '{{cardExpiryMonth}}'
                      expiryYear: '{{cardExpiryYear}}'
                      cvc: '{{cardSecurityCode}}'
                      holderName: '{{cardHolderName}}'
                    Signature: '{{requestHashSignature}}'
                  preProcessors:
                    - code: calculatehash
                      parameters:
                        hashEncoding: base64
                        payload: string used to calculate the hash with {{cardNumber}} and other placeholders in the body. {{requestBodyString}} is supported if the entire body needs to be used for signature calculation.
                        algorithm: sha256
      responses:
        '200':
          description: Executed.
          content:
            application/json:
              schema:
                type: object
                required:
