          application/json:
            schema:
              type: object
              required:
                - reference
              properties:
                reference:
                  type: string
                  description: Merchant-specific reference for the Holder. Usually mapped to the user ID in the merchant's system.
                type:
                  type: string
                  description: Value of merchant-defined enumeration of Holder Types.
            example:
              reference: customer-123
              type: Customer
