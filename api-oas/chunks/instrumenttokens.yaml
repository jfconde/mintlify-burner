openapi: 3.1.0
info:
  version: 1.3.15
  title: Payrails API Reference
  contact:
    name: Payrails
    url: https://www.payrails.com
    email: tech@payrails.com
  license:
    name: Payrails GmbH
    url: https://www.payrails.com/
  description: |
    ---
    Payrails provides a collection of APIs that enable you to process and manage payments. Our APIs accept and return JSON in the HTTP body, and return standard HTTP response codes. You can consume the APIs directly using your favorite HTTP/REST library.
servers:
  - url: https://api.staging.payrails.io
    description: Payrails environment.
security:
  - ApiKey: []
tags:
  - name: InstrumentTokens
    description: Tokens are representations of our payment instruments in external providers. One payment instrument can have many tokens, because we keep the mapping in each external provider that knows about it. For example, the same real life card can have a token in our Vault, but also in Adyen and Checkout PSPs.
paths:
  /payment/instruments/{instrumentId}/tokens:
    get:
      summary: Search & list tokens
      operationId: listTokens
      description: Fetch a list of tokens for a payment instrument.
      tags:
        - InstrumentTokens
      security:
        - BearerToken:
            - tokens:list
      parameters:
        - name: instrumentId
          in: path
          description: Identifier of the resource in Payrails.
          required: true
          schema:
            type: string
            format: uuid
          example: d5454c2f-ae5e-44f3-8edf-f6dad64f005f
        - name: filter[status]
          in: query
          schema:
            type: string
          description: Filter for a list of tokens by status.
        - name: filter[anyReference]
          in: query
          schema:
            type: string
          description: Filter for a list of tokens by any reference.
        - name: filter[createdAt]
          in: query
          description: |
            Filter by `createdAt` field using interval notation.

            `1973-02-03T04:32:11.596Z` - exact date value

            `(1973-02-03T04:32:11.596Z` - after the date excluding it

            `[1973-02-03T04:32:11.596Z` - after the date including it

            `1973-02-03T04:32:11.596Z)` - before the date excluding it

            `1973-02-03T04:32:11.596Z]` - before the date including it

            `(1973-02-03T04:32:11.596Z,1973-04-03T03:20:11.436Z)` - between two dates excluding both

            `(1973-02-03T04:32:11.596Z,1973-04-03T03:20:11.436Z]` - between two dates excluding on the left

            `[1973-02-03T04:32:11.596Z,1973-04-03T03:20:11.436Z)` - between two dates excluding on the right

            `[1973-02-03T04:32:11.596Z,1973-04-03T03:20:11.436Z]` - between two dates including both.
          schema:
            type: string
            example: '[2026-04-01T00:00:00Z,2026-05-01T00:00:00Z)'
        - name: page[cursor]
          in: query
          description: Search collection items from that cursor.
          required: false
          schema:
            type: string
            description: Cursor for paging results.
          example: 9wkueqcavq
        - name: page[after]
          in: query
          description: Search collection items after that cursor.
          required: false
          schema:
            type: string
            description: Cursor for paging results.
          example: xk2h55zsy5
        - name: page[before]
          in: query
          description: Search collection items before that cursor.
          required: false
          schema:
            type: string
            description: Cursor for paging results.
          example: 9wkueqcavq
        - name: page[size]
          in: query
          description: Length of the collection to search.
          required: false
          schema:
            type: integer
            format: int32
          example: 20
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  paging:
                    type: object
                    description: Paging information about the results.
                    properties:
                      next:
                        type: string
                        example: '?createdAtOrAfter=2022-02-11+00%3A00%3A00&createdAtOrBefore=2022-02-11+20%3A17%3A52.885&limit=50&pagingIdBefore=payment-acceptance%2Fa43c3080-7357-582b-bed3-7f68606c708b'
                  results:
                    type: array
                    description: List of results for the query.
                    items:
                      type: object
                      required:
                        - id
                        - instrumentId
                        - providerId
                        - reference
                        - status
                        - type
                        - createdAt
                        - updatedAt
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Id of the token in Payrails.
                        createdAt:
                          type: string
                          format: date-time
                          description: Date and time when the Token was created in Payrails.
                        updatedAt:
                          type: string
                          format: date-time
                          description: When the Token was last updated.
                        instrumentId:
                          type: string
                          format: uuid
                          description: Id of the payment instrument the token belongs to.
                        status:
                          type: string
                          description: Status of the token.
                          enum:
                            - created
                            - enabled
                            - disabled
                            - deleted
                        type:
                          type: string
                          description: Type of the token.
                          enum:
                            - network
                            - vault
                            - psp
                            - networkOffers
                            - networkGateway
                        providerId:
                          type: string
                          format: uuid
                          description: Id of the provider the token belongs to.
                        providerConfigId:
                          type: string
                          format: uuid
                          description: Id of the configuration in the provider the token belongs to.
                        reference:
                          type: string
                          description: Unique identifier of the token in the provider's system.
                        meta:
                          description: Any merchant or provider-specific data that should be stored for context in the token.
                          type: object
                          additionalProperties: true
              example:
                paging:
                  next: '?createdAtOrAfter=2022-02-11+00%3A00%3A00&createdAtOrBefore=2022-02-11+20%3A17%3A52.885&limit=50&pagingIdBefore=payment-acceptance%2Fa43c3080-7357-582b-bed3-7f68606c708b'
                results:
                  - id: 5671c2cc-32c4-437d-a830-c449db87c542
                    createdAt: '2022-04-22T17:53:36.814Z'
                    updatedAt: '2022-04-22T17:53:36.814Z'
                    instrumentId: b8fe6271-5d71-4d28-b8e8-89e64acc0c49
                    status: created
                    type: network
                    providerId: e0ba44eb-1d54-4317-823b-d2f9419d3b9d
                    providerConfigId: 69e0aac4-2939-427e-aa37-d79e4989219c
                    reference: token-in-the-provider
                    meta:
                      securityCodeExpireAt: '2023-08-06T09:16:10.011778Z'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      description: Error struct that includes the error, cause, reason, and possible resolutions. Check the full documentation [here](https://docs.payrails.com/docs/error-codes#error-structure).
                      required:
