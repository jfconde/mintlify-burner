  /payment/instruments/{instrumentId}/tokens/{tokenId}:
    get:
      tags:
        - InstrumentTokens
      summary: Get a token by ID
      description: Get a token by its ID in the provider.
      operationId: getToken
      security:
        - BearerToken:
            - tokens:read
      parameters:
        - name: instrumentId
          in: path
          description: Identifier of the resource in Payrails.
          required: true
          schema:
            type: string
            format: uuid
          example: d5454c2f-ae5e-44f3-8edf-f6dad64f005f
        - name: tokenId
          in: path
          description: Identifier of the resource in Payrails.
          required: true
          schema:
            type: string
            format: uuid
          example: d5454c2f-ae5e-44f3-8edf-f6dad64f005f
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - instrumentId
                  - providerId
                  - reference
                  - status
                  - type
                  - createdAt
                  - updatedAt
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Id of the token in Payrails.
                  createdAt:
                    type: string
                    format: date-time
                    description: Date and time when the Token was created in Payrails.
                  updatedAt:
                    type: string
                    format: date-time
                    description: When the Token was last updated.
                  instrumentId:
                    type: string
                    format: uuid
                    description: Id of the payment instrument the token belongs to.
                  status:
                    type: string
                    description: Status of the token.
                    enum:
                      - created
                      - enabled
