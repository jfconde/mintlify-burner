    post:
      summary: Create a token
      description: Create a token for a payment instrument.
      operationId: createToken
      tags:
        - InstrumentTokens
      security:
        - BearerToken:
            - tokens:create
      parameters:
        - name: x-idempotency-key
          in: header
          description: |
            Idempotency key to be used.
            Sending again the same key would return the same result without re-executing the update.
          required: true
          schema:
            type: string
            format: uuid
          example: 91874e4d-81e9-4486-aee4-ee1de84da890
        - name: instrumentId
          in: path
          description: Identifier of the resource in Payrails.
          required: true
          schema:
            type: string
            format: uuid
          example: d5454c2f-ae5e-44f3-8edf-f6dad64f005f
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - providerId
                - reference
                - type
              properties:
                providerId:
                  type: string
                  format: uuid
                  description: Id of the provider the token belongs to.
                providerConfigId:
                  type: string
                  format: uuid
                  description: Id of the configuration in the provider the token belongs to.
                type:
                  type: string
                  description: Type of the token.
                  enum:
                    - network
                    - vault
                    - psp
                    - networkOffers
                    - networkGateway
                reference:
                  type: string
                  description: Unique identifier of the token in the provider's system.
                meta:
                  description: Any merchant or provider-specific data that should be stored for context in the token, e.g. `holderReference` is required for Adyen tokens.
                  type: object
                  additionalProperties: true
            example:
              type: network
              providerId: e0ba44eb-1d54-4317-823b-d2f9419d3b9d
              providerConfigId: 69e0aac4-2939-427e-aa37-d79e4989219c
              reference: token-in-the-provider
              meta:
                holderReference: consumer-123
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - instrumentId
                  - providerId
                  - reference
                  - status
                  - type
                  - createdAt
                  - updatedAt
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Id of the token in Payrails.
                  createdAt:
                    type: string
                    format: date-time
                    description: Date and time when the Token was created in Payrails.
                  updatedAt:
                    type: string
                    format: date-time
                    description: When the Token was last updated.
                  instrumentId:
                    type: string
                    format: uuid
                    description: Id of the payment instrument the token belongs to.
                  status:
                    type: string
                    description: Status of the token.
                    enum:
                      - created
                      - enabled
                      - disabled
                      - deleted
                  type:
                    type: string
                    description: Type of the token.
                    enum:
                      - network
                      - vault
                      - psp
                      - networkOffers
                      - networkGateway
                  providerId:
                    type: string
                    format: uuid
                    description: Id of the provider the token belongs to.
                  providerConfigId:
                    type: string
                    format: uuid
                    description: Id of the configuration in the provider the token belongs to.
                  reference:
                    type: string
                    description: Unique identifier of the token in the provider's system.
                  meta:
                    description: Any merchant or provider-specific data that should be stored for context in the token.
                    type: object
                    additionalProperties: true
              example:
                id: 5671c2cc-32c4-437d-a830-c449db87c542
                createdAt: '2022-04-22T17:53:36.814Z'
                updatedAt: '2022-04-22T17:53:36.814Z'
