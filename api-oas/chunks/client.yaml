                                    - type: object
                                      description: Variable amount subscription model.
                                      properties:
                                        amountType:
                                          type: string
                                          enum:
                                            - variable
                                          description: Subscription charges a variable amount with a minimum value. Used by subscription mandates such as Pix Automático.
                                        minAmount:
                                          type: string
                                          description: The minimum authorization limit per cycle, in the transaction currency.
                                      required:
