                                      type: string
                                      format: date
                                      description: Date when the subscription starts. Used by subscription mandates such as Pix Automático.
                                    scheduledDate:
                                      type: string
                                      format: date
                                      description: Date on which a recurring merchant-initiated transaction is scheduled to be processed. Submit this field for recurring MITs only when required by the selected payment method, such as certain account-to-account and direct debit payment methods.
                                - oneOf:
                                    - type: object
