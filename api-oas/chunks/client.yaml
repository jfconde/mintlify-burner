                                            type: object
                                            required:
                                              - code
                                            properties:
                                              code:
                                                type: string
                                                description: ISO 3166-1 alpha-2 country code.
                                                pattern: ^[A-Z]{2}$
                                              iso3:
                                                type: string
                                                description: ISO 3-letter country code. Returned by Payrails, but not interpreted in requests.
                                                pattern: ^[A-Z]{3}$
                                              name:
                                                type: string
                                                description: The English name of the country. Returned by Payrails, but not interpreted in requests.
                                          latitude:
                                            type: number
                                            format: float
                                            description: Latitude of the address in the GPS coordinate system.
                                          longitude:
                                            type: number
                                            format: float
                                            description: Longitude of the address in the GPS coordinate system.
                                          phone:
                                            description: The phone to contact in the address (can be different that the customer's).
                                            type: object
                                            required:
                                              - number
                                            properties:
                                              countryCode:
                                                type: string
                                                pattern: ^\+?[0-9]+$
                                                description: International prefix of the phone, if known separately.
                                              number:
                                                type: string
                                                pattern: ^[0-9]+$
                                                description: The local number of the phone, such that `countryCode` + `number` can be dialed.
                                          alias:
                                            type: string
                                            description: Name of the address, e.g. home, work.
                                          name:
                                            type: string
                                            description: Name of the person to whom the address belongs to.
                                          lastName:
                                            type: string
                                            description: Last name of the person to whom the address belongs to.
                                          email:
                                            type: string
                                            description: Email of the person to whom the address belongs to.
                                      amount:
                                        description: |
                                          The amount of the payment corresponding to the sub-merchant.
                                        type: object
                                        required:
                                          - value
                                          - currency
                                        properties:
                                          value:
                                            type: string
                                            pattern: '[0-9]+(\.[0-9]+)?'
                                            example: '12.50'
                                            description: Decimal amount of the major currency unit. Can be any precision.
                                          currency:
                                            type: string
                                            pattern: ^[A-Z]{3}$
                                            example: EUR
                                            description: ISO 3-letter currency code.
                            risk:
                              type: object
                              description: Configuration values for the risk prevention check.
                              properties:
                                score:
                                  type: string
                                  description: Score provided by an external fraud prevention system.
                                skipPaymentProviderRules:
                                  type: boolean
                                  description: True if the provider should skip the risk rules.
                                skipFraudDecision:
                                  type: boolean
                                  description: True if fraud-check providers should bypass their own review/decisioning for this transaction (e.g. a trusted customer, or a payment whose liability has already shifted to the issuer via 3DS). Typically set by the merchant's workflow rather than the caller directly.
                                force3DS:
                                  type: boolean
                                  description: Deprecated, use threeDSMode instead. True if we should request the provider to force a 3DS process. The actual execution of 3DS will depend on its availability and configuration on the provider and the issuer.
                                  deprecated: true
                                threeDSMode:
                                  type: string
                                  enum:
                                    - Skip
                                    - Force
                                    - Default
                                  description: 3DS mode to send in an authorize request to a PSP.
                                allowNative3DS:
                                  type: boolean
                                  description: True if we should allow native experience in mobile devices when 3DS 2.x is triggered. If false, we will prefer redirection-based flows.
                                sessionId:
                                  type: string
                                  deprecated: true
                                  description: |
                                    Deprecated in favour of sessions. Session ID provided by an external fraud prevention system. Kept only for older web-SDK versions and direct API integrations that haven't migrated yet.
                                sessions:
                                  type: array
                                  description: |
                                    Session/device IDs for one or more external fraud prevention systems. This is the standard way to provide a fraud session id, whether one provider is configured or several.
                                  items:
                                    type: object
                                    required:
                                      - provider
                                      - sessionId
                                    properties:
                                      provider:
                                        type: string
                                        description: Identifier of the fraud prevention provider this session ID belongs to.
                                        enum:
                                          - riskified
                                          - signifyd
                                          - ravelin
                                          - cybersource
                                          - forter
                                          - airwallex
                                          - stripe
                                      sessionId:
                                        type: string
                                        description: Session/device ID provided by this fraud prevention provider.
                                      providerConfigId:
                                        type: string
                                        format: uuid
                                        description: |
                                          Disambiguates multiple sessions for the same provider, when more than one configured instance of that provider is in play. Optional; omit unless more than one session for the same provider is present.
                                exemptionIndicator:
                                  type: string
                                  description: |
                                    Indicates the exemption that you want to request in case a 3DS process is triggered.The issuer decides if the exemption is granted or not. For some types of transaction, the issuer can grant an exemption without you requesting it. Possible values are * lowValue - For payments below 30 EUR (or equivalent converted amount) are considered “low value” and might be exempt from SCA. SCA is required if the total amount is higher than 100 EUR, and every 5 transactions. * transactionRiskAnalysis - For payments through acquirers or issuers whose fraud level is below a certain threshold. * secureCorporate - For payments that use secure corporate cards, which are exempt from 3DS authentication. * trustedBeneficiary - For payments where the cardholder has already added the merchant to a trust list on their bank. * trustedBeneficiaryPrompt - For payments where the merchant would like to prompt the cardholder to add them as a trusted merchant. * dataShare - Data Sharing exemptions for transactions that are not subject to Strong Customer Authentication (SCA) compliance.
                                  enum:
                                    - lowValue
                                    - transactionRiskAnalysis
                                    - secureCorporate
                                    - trustedBeneficiary
                                    - trustedBeneficiaryPrompt
                                    - dataShare
                            subscription:
                              type: object
                              description: Configuration of a subscription process.
                              allOf:
                                - type: object
                                  properties:
                                    chargeFrequency:
                                      type: string
                                      description: Scheduled interval between subscription payments. The format should be based on the [ISO 8601 standard](https://tc39.es/proposal-temporal/docs/duration.html).
                                    expiration:
                                      type: string
                                      format: date
                                      description: Date when recurring payments expire.
