openapi: 3.1.0
info:
  version: 1.3.15
  title: Payrails API Reference
  contact:
    name: Payrails
    url: https://www.payrails.com
    email: tech@payrails.com
  license:
    name: Payrails GmbH
    url: https://www.payrails.com/
  description: |
    ---
    Payrails provides a collection of APIs that enable you to process and manage payments. Our APIs accept and return JSON in the HTTP body, and return standard HTTP response codes. You can consume the APIs directly using your favorite HTTP/REST library.
servers:
  - url: https://api.staging.payrails.io
    description: Payrails environment.
security:
  - ApiKey: []
tags:
  - name: Client
    description: Endpoints used by our client-side SDK.
paths:
  /merchant/client/init:
    post:
      summary: Initialize a client SDK
      operationId: clientInit
      description: |
        Fetch the necessary information used to initialize Payrails SDK on your client.
      security:
        - BearerToken:
            - sdk:read:config
      tags:
        - Client
      parameters:
        - name: x-idempotency-key
          in: header
          description: |
            Idempotency key to be used.
            Sending again the same key would return the same result without re-executing the update.
          required: true
          schema:
            type: string
            format: uuid
          example: 91874e4d-81e9-4486-aee4-ee1de84da890
      requestBody:
        content:
          application/json:
            schema:
              type: object
              title: Request to get the necessary information used to initialize the client SDK.
              allOf:
                - type: object
                  properties:
                    holderReference:
                      type: string
                      description: Merchant-provided reference for the transaction counterparty, i.e. the paying consumer.
                - type: object
                  anyOf:
                    - type: object
                      title: SecureFields.
                      required:
                        - type
                      properties:
                        type:
                          type: string
                          description: |
                            The type of client side elements that you need a configuration for `secureFields`: Secure Fields are a highly customizable card form for tokenization.
                          enum:
                            - secureFields
                        instrumentId:
                          type: string
                          format: uuid
                          description: If initializing the SDK for updating the `securityCode` for an instrument, this is the unique identifier of it in Payrails.
                    - type: object
                      title: DropIn.
                      required:
                        - type
                        - workflowCode
                        - merchantReference
                        - amount
                      properties:
                        type:
                          type: string
                          description: |
                            The type of client side elements that you need a configuration for `dropIn`: Drop-in is our pre-built UI solution for accepting payments on your application.
                          enum:
                            - dropIn
                        workflowCode:
                          type: string
                          pattern: ^[a-z][-A-Za-z0-9]*$
                          description: Machine-friendly code of Workflow.
                        workflowVersion:
                          type: integer
                          description: Version of a Workflow Configuration.
                        merchantReference:
                          type: string
                          description: Merchant-provided reference for the Execution. Commonly, the identifier of the order on the Merchant's system.
                          example: order_15415
                        amount:
                          type: object
                          required:
                            - value
                            - currency
                          properties:
                            value:
                              type: string
                              pattern: '[0-9]+(\.[0-9]+)?'
                              example: '12.50'
                              description: Decimal amount of the major currency unit. Can be any precision.
                            currency:
                              type: string
                              pattern: ^[A-Z]{3}$
                              example: EUR
                              description: ISO 3-letter currency code.
                        meta:
                          type: object
                          description: Metadata for the context of an execution. Includes Payrails-defined structures for most common fields used in workflows, but can also be extended by merchant or provider-specific fields. For more information, visit our [Meta Fields guide](https://docs.payrails.com/docs/configure-meta-fields-for-your-providers).
                          additionalProperties: true
                          properties:
                            order:
                              type: object
                              description: The order being placed on your system.
                              properties:
                                reference:
                                  type: string
                                  description: Order reference number sent by the merchant. Defaults to `merchantReference` in the execution if not specified.
                                description:
                                  type: string
                                  description: A human-readable name or description of this order.
                                softDescriptor:
                                  type: string
                                  description: Text that should appear in the bank statement of the customer. Can be requested, but keep in mind that some providers and issuers don't allow you to change this.
                                storeId:
                                  type: string
                                  description: Order Store ID identifies the particular store associated with this order.
                                placement:
                                  type: object
                                  description: Data about where the order was placed.
                                  properties:
                                    country:
                                      description: Country in which the customer placed the order.
                                      type: object
                                      required:
                                        - code
                                      properties:
                                        code:
                                          type: string
                                          description: ISO 3166-1 alpha-2 country code.
                                          pattern: ^[A-Z]{2}$
                                        iso3:
                                          type: string
                                          description: ISO 3-letter country code. Returned by Payrails, but not interpreted in requests.
                                          pattern: ^[A-Z]{3}$
                                        name:
                                          type: string
                                          description: The English name of the country. Returned by Payrails, but not interpreted in requests.
                                    city:
                                      type: string
                                      description: City in which the customer placed the order.
                                deliveryAddress:
                                  description: The address the items are to be shipped to.
                                  type: object
                                  properties:
                                    street:
                                      type: string
                                      description: The name of the street of a postal address.
                                    doorNumber:
                                      type: string
                                      description: The number on the door, building, or room.
                                    complement:
                                      type: string
                                      description: Additional addressing information, 2nd line of postal address.
                                    area:
                                      type: string
                                      description: The name of the suburb or area within a city.
                                    city:
                                      type: string
                                      description: The name of the city of a postal address.
                                    postalCode:
                                      type: string
                                      description: The postal code.
                                    state:
                                      type: string
                                      description: The name of the state a postal address is in.
                                    country:
                                      description: The country where the address is in.
                                      type: object
                                      required:
                                        - code
                                      properties:
                                        code:
                                          type: string
                                          description: ISO 3166-1 alpha-2 country code.
                                          pattern: ^[A-Z]{2}$
                                        iso3:
                                          type: string
                                          description: ISO 3-letter country code. Returned by Payrails, but not interpreted in requests.
                                          pattern: ^[A-Z]{3}$
                                        name:
                                          type: string
                                          description: The English name of the country. Returned by Payrails, but not interpreted in requests.
                                    latitude:
                                      type: number
                                      format: float
                                      description: Latitude of the address in the GPS coordinate system.
                                    longitude:
                                      type: number
                                      format: float
                                      description: Longitude of the address in the GPS coordinate system.
                                    phone:
                                      description: The phone to contact in the address (can be different that the customer's).
                                      type: object
                                      required:
                                        - number
                                      properties:
                                        countryCode:
                                          type: string
                                          pattern: ^\+?[0-9]+$
                                          description: International prefix of the phone, if known separately.
                                        number:
                                          type: string
                                          pattern: ^[0-9]+$
                                          description: The local number of the phone, such that `countryCode` + `number` can be dialed.
                                    alias:
                                      type: string
                                      description: Name of the address, e.g. home, work.
                                    name:
                                      type: string
                                      description: Name of the person to whom the address belongs to.
                                    lastName:
                                      type: string
                                      description: Last name of the person to whom the address belongs to.
                                    email:
                                      type: string
                                      description: Email of the person to whom the address belongs to.
                                deliveryAddressPreference:
                                  type: string
                                  description: Determines which Shipping details to use in express payment methods.
                                  enum:
                                    - noShipping
                                    - userPreSpecified
                                    - allowProviderOverride
                                deliveryDate:
                                  type: string
                                  format: date-time
                                  description: When the order is to be delivered.
                                billingAddress:
                                  description: The address to put on the bill for this order.
                                  type: object
                                  properties:
                                    street:
                                      type: string
                                      description: The name of the street of a postal address.
                                    doorNumber:
                                      type: string
                                      description: The number on the door, building, or room.
                                    complement:
                                      type: string
                                      description: Additional addressing information, 2nd line of postal address.
                                    area:
                                      type: string
                                      description: The name of the suburb or area within a city.
                                    city:
                                      type: string
                                      description: The name of the city of a postal address.
                                    postalCode:
                                      type: string
                                      description: The postal code.
                                    state:
                                      type: string
                                      description: The name of the state a postal address is in.
                                    country:
                                      description: The country where the address is in.
                                      type: object
                                      required:
                                        - code
                                      properties:
                                        code:
                                          type: string
                                          description: ISO 3166-1 alpha-2 country code.
                                          pattern: ^[A-Z]{2}$
                                        iso3:
                                          type: string
                                          description: ISO 3-letter country code. Returned by Payrails, but not interpreted in requests.
                                          pattern: ^[A-Z]{3}$
                                        name:
                                          type: string
                                          description: The English name of the country. Returned by Payrails, but not interpreted in requests.
                                    latitude:
                                      type: number
                                      format: float
                                      description: Latitude of the address in the GPS coordinate system.
                                    longitude:
                                      type: number
                                      format: float
                                      description: Longitude of the address in the GPS coordinate system.
                                    phone:
                                      description: The phone to contact in the address (can be different that the customer's).
                                      type: object
                                      required:
                                        - number
                                      properties:
                                        countryCode:
                                          type: string
                                          pattern: ^\+?[0-9]+$
                                          description: International prefix of the phone, if known separately.
                                        number:
                                          type: string
                                          pattern: ^[0-9]+$
                                          description: The local number of the phone, such that `countryCode` + `number` can be dialed.
                                    alias:
                                      type: string
                                      description: Name of the address, e.g. home, work.
                                    name:
                                      type: string
                                      description: Name of the person to whom the address belongs to.
                                    lastName:
                                      type: string
                                      description: Last name of the person to whom the address belongs to.
                                    email:
                                      type: string
                                      description: Email of the person to whom the address belongs to.
                                shippingType:
                                  type: string
                                  description: |
                                    The method by which the order is fulfilled:
                                    - `pickup`: The customer picks up the order.
                                    - `physical`: The order is physically delivered.
                                    - `digital`: The order is delivered electronically.
                                    - `hybrid`: A combination of physical and digital fulfillment.
                                  enum:
                                    - pickup
                                    - physical
                                    - hybrid
                                    - digital
                                shipping:
                                  description: The shipping total price of the order.
                                  type: object
                                  required:
                                    - value
                                    - currency
                                  properties:
                                    value:
                                      type: string
                                      pattern: '[0-9]+(\.[0-9]+)?'
                                      example: '12.50'
                                      description: Decimal amount of the major currency unit. Can be any precision.
                                    currency:
                                      type: string
                                      pattern: ^[A-Z]{3}$
                                      example: EUR
                                      description: ISO 3-letter currency code.
                                totalDiscount:
                                  description: The total discount applied on the order.
                                  type: object
                                  required:
                                    - value
                                    - currency
                                  properties:
                                    value:
                                      type: string
                                      pattern: '[0-9]+(\.[0-9]+)?'
                                      example: '12.50'
                                      description: Decimal amount of the major currency unit. Can be any precision.
                                    currency:
                                      type: string
                                      pattern: ^[A-Z]{3}$
                                      example: EUR
                                      description: ISO 3-letter currency code.
                                totalTax:
                                  description: The total taxes for the order.
                                  type: object
                                  required:
                                    - value
                                    - currency
                                  properties:
                                    value:
                                      type: string
                                      pattern: '[0-9]+(\.[0-9]+)?'
                                      example: '12.50'
                                      description: Decimal amount of the major currency unit. Can be any precision.
                                    currency:
                                      type: string
                                      pattern: ^[A-Z]{3}$
                                      example: EUR
                                      description: ISO 3-letter currency code.
                                lines:
                                  type: array
                                  description: List of details per item in the order.
                                  items:
                                    type: object
                                    description: Detail of an order item.
                                    properties:
                                      name:
                                        type: string
                                        description: The name of the item.
                                      description:
                                        type: string
                                        description: The description of the item.
                                      product:
                                        type: object
                                        description: The details of the product item.
                                        properties:
                                          type:
                                            type: string
                                            description: The type of the product item.
                                            enum:
                                              - physical
                                              - digital
                                              - service
                                      categoryId:
                                        type: string
                                        description: Category identifier of the item on the merchant's system.
                                      type:
                                        type: string
                                        description: The type of the item. the line value will be added to the order total in case of `lineItem`, `tax` and subtracted from order total in case of `discount`.
                                        enum:
                                          - lineItem
                                          - discount
                                          - tax
                                      quantity:
                                        type: integer
                                        description: How many instances of this item are part of the order.
                                      unitPrice:
                                        description: How much does a unit of the item cost.
                                        type: object
                                        required:
                                          - value
                                          - currency
                                        properties:
                                          value:
                                            type: string
                                            pattern: '[0-9]+(\.[0-9]+)?'
                                            example: '12.50'
                                            description: Decimal amount of the major currency unit. Can be any precision.
                                          currency:
                                            type: string
                                            pattern: ^[A-Z]{3}$
                                            example: EUR
                                            description: ISO 3-letter currency code.
                                      total:
                                        description: Cost of unit price multiplied by quantity with the tax and discount applied.
                                        type: object
                                        required:
                                          - value
                                          - currency
                                        properties:
                                          value:
                                            type: string
                                            pattern: '[0-9]+(\.[0-9]+)?'
                                            example: '12.50'
                                            description: Decimal amount of the major currency unit. Can be any precision.
                                          currency:
                                            type: string
                                            pattern: ^[A-Z]{3}$
                                            example: EUR
                                            description: ISO 3-letter currency code.
                                      taxPercentage:
                                        description: Tax percentage that applies to the specific item, applicable only where `item.type == lineItem`, will be ignored when not providing `item.unitPrice`.
                                        type: object
                                        required:
                                          - value
                                        properties:
                                          value:
                                            type: string
                                            pattern: ^((100)|(\d{1,2}(\.\d*)?))$
                                            example: '12.50'
                                            description: A percentage value up to 2 decimal precision.
                                      totalDiscount:
                                        description: The total discount applied on this item (quantity x discount per item), applicable only where `item.type == lineItem`, will be ignored when not providing `item.unitPrice`.
                                        type: object
                                        required:
                                          - value
                                          - currency
                                        properties:
                                          value:
                                            type: string
                                            pattern: '[0-9]+(\.[0-9]+)?'
                                            example: '12.50'
                                            description: Decimal amount of the major currency unit. Can be any precision.
                                          currency:
                                            type: string
                                            pattern: ^[A-Z]{3}$
                                            example: EUR
                                            description: ISO 3-letter currency code.
                                      totalTax:
                                        description: The total tax added for this item (quantity x tax per item), applicable only where `items.type = lineItem`, will be ignored when not providing `item.unitPrice`.
                                        type: object
                                        required:
                                          - value
                                          - currency
                                        properties:
                                          value:
                                            type: string
                                            pattern: '[0-9]+(\.[0-9]+)?'
                                            example: '12.50'
                                            description: Decimal amount of the major currency unit. Can be any precision.
                                          currency:
                                            type: string
                                            pattern: ^[A-Z]{3}$
                                            example: EUR
                                            description: ISO 3-letter currency code.
                                      id:
                                        type: string
                                        description: Identifier of the item on the merchant's system.
                                      brand:
                                        type: string
                                        description: The manufacturer or brand name of the item.
                                      weight:
                                        type: number
                                        format: float
                                        description: The weight of the item, in kilograms.
                                      links:
                                        type: object
                                        description: Relevant links about the item.
                                        properties:
                                          productUrl:
                                            type: string
                                            description: URL of the product information page.
                                          imageUrl:
                                            type: string
                                            description: URL of the image of the item.
                                      travelTicket:
                                        type: object
                                        description: Details about the travel ticket.
                                        properties:
                                          ticketId:
                                            type: string
                                            description: The ID of the travel ticket.
                                          passengers:
                                            type: array
                                            description: The passengers on the travel ticket.
                                            items:
                                              type: object
                                              description: A passenger on the travel ticket.
                                              properties:
                                                name:
                                                  type: string
                                                  description: The name of the passenger.
                                                lastName:
                                                  type: string
                                                  description: The last name of the passenger.
                                                phone:
                                                  description: The phone number of the passenger.
                                                  type: object
                                                  required:
                                                    - number
                                                  properties:
                                                    countryCode:
                                                      type: string
                                                      pattern: ^\+?[0-9]+$
                                                      description: International prefix of the phone, if known separately.
                                                    number:
                                                      type: string
                                                      pattern: ^[0-9]+$
                                                      description: The local number of the phone, such that `countryCode` + `number` can be dialed.
                                                passengerType:
                                                  type: string
                                                  description: The type of the passenger.
                                                  enum:
                                                    - adult
                                                    - child
                                                    - infant
                                                    - senior
                                                email:
                                                  type: string
                                                  description: The email of the passenger.
                                          routes:
                                            type: array
                                            description: The routes on the travel ticket.
                                            items:
                                              type: object
                                              description: A route on the travel ticket.
                                              properties:
                                                legs:
                                                  type: array
                                                  description: The legs on the route.
                                                  items:
                                                    type: object
                                                    description: A leg on the route.
                                                    properties:
                                                      legId:
                                                        type: string
                                                        description: The ID of the leg.
                                                      departure:
                                                        type: object
                                                        description: A point on a travel ticket leg.
                                                        properties:
                                                          city:
                                                            type: string
                                                            description: The city of the point.
                                                          country:
                                                            description: The country of the point.
                                                            type: object
                                                            required:
                                                              - code
                                                            properties:
                                                              code:
                                                                type: string
                                                                description: ISO 3166-1 alpha-2 country code.
                                                                pattern: ^[A-Z]{2}$
                                                              iso3:
                                                                type: string
                                                                description: ISO 3-letter country code. Returned by Payrails, but not interpreted in requests.
                                                                pattern: ^[A-Z]{3}$
                                                              name:
                                                                type: string
                                                                description: The English name of the country. Returned by Payrails, but not interpreted in requests.
                                                          time:
                                                            type: string
                                                            format: date-time
                                                            description: The time of the point.
                                                      arrival:
                                                        type: object
                                                        description: A point on a travel ticket leg.
                                                        properties:
                                                          city:
                                                            type: string
                                                            description: The city of the point.
                                                          country:
                                                            description: The country of the point.
                                                            type: object
                                                            required:
                                                              - code
                                                            properties:
                                                              code:
                                                                type: string
                                                                description: ISO 3166-1 alpha-2 country code.
                                                                pattern: ^[A-Z]{2}$
                                                              iso3:
                                                                type: string
                                                                description: ISO 3-letter country code. Returned by Payrails, but not interpreted in requests.
                                                                pattern: ^[A-Z]{3}$
                                                              name:
                                                                type: string
                                                                description: The English name of the country. Returned by Payrails, but not interpreted in requests.
                                                          time:
                                                            type: string
                                                            format: date-time
                                                            description: The time of the point.
                                total:
                                  description: Total order value. Can be different than the execution amount in case discounts or other costs are involved. This value will be ignored if costs are detailed in the `lines` array.
                                  type: object
                                  required:
                                    - value
                                    - currency
                                  properties:
                                    value:
                                      type: string
                                      pattern: '[0-9]+(\.[0-9]+)?'
                                      example: '12.50'
                                      description: Decimal amount of the major currency unit. Can be any precision.
                                    currency:
                                      type: string
                                      pattern: ^[A-Z]{3}$
                                      example: EUR
                                      description: ISO 3-letter currency code.
                                processingType:
                                  description: Processing type of the order.
                                  type: string
                                  enum:
                                    - Regular
                                    - Subscription
                                    - CardOnFile
                                    - UnscheduledCardOnFile
                                    - MOTO
                                    - InPerson
                                createdAt:
                                  type: string
                                  format: date-time
                                  description: The order's creation date in RFC 3339 format.
                                pendingStateDuration:
                                  type: string
                                  description: Controls how long the execution is allowed to remain in pending state. If the transaction has not reached a final state within this duration, the execution is automatically cancelled. The format should be based on the ISO 8601 standard.
                                  example: PT10M
                                fundsTransfer:
                                  description: The order funds transfer details in case this is an AFT transaction.
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                      description: The type of funds transfer.
                                      enum:
                                        - disbursement
                                        - personToPerson
                                        - accountToAccount
                                        - topUp
                                        - purchase
                                        - cash
                                        - walletLoad
                                    purpose:
                                      type: string
                                      description: A human-readable description of the purpose for the funds transfer.
                                      enum:
                                        - donation
                                        - education
                                        - emergency
                                        - expatriation
                                        - familySupport
                                        - financialServices
                                        - gifts
                                        - income
                                        - insurance
                                        - investment
                                        - itServices
                                        - leisure
                                        - loanPayment
                                        - medical
                                        - business
                                        - crypto
                                        - assets
                                        - prepaid
                                        - crowdLending
                                        - debitCard
                                        - giftCard
                                        - gaming
                                        - highRiskSecurities
                                        - salary
                                        - pension
                                        - royalities
                                        - savings
                                        - travelAndTourism
                                        - other
                                    recipient:
                                      type: object
                                      description: Details of the individual or entity receiving the funds.
                                      properties:
                                        account:
                                          description: The account details for the recipient.
                                          type: object
                                          properties:
                                            type:
                                              type: string
                                              description: The type of account.
                                              enum:
                                                - bankAccount
                                                - card
                                                - wallet
                                                - storedValueWallet
                                                - stagedDigitalWallet
                                                - merchantWallet
                                                - email
                                                - phone
                                                - socialNetwork
                                            identifierType:
                                              type: string
                                              description: The identifier type for a bankAccount.
                                              enum:
                                                - iban
                                                - swift
                                                - routingNumber
                                            iban:
                                              type: string
                                              description: IBAN for a bank account.
                                            accountNumber:
                                              type: string
                                              description: Account number for a bank account.
                                            bankCode:
                                              type: string
                                              description: Bank code for a bank account. Can be a SWIFT/BIC or local code.
                                            routingNumber:
                                              type: string
                                              description: Routing number for a US domestic bank account.
                                            reference:
                                              type: string
                                              description: Generic identifier for non-bank accounts. Used for card numbers, wallet IDs, email, or phone numbers.
                                        customer:
                                          description: The details of the recipient.
                                          type: object
                                          properties:
                                            reference:
                                              type: string
                                              description: Customer reference number specified by the merchant. Defaults to `holderReference` of the execution if not specified.
                                            name:
                                              type: string
                                              description: The full name (or first name, if you can provide `lastName` separate) of the customer.
                                            lastName:
                                              type: string
                                              description: Last name of the customer (if required to be separate from `name`).
                                            email:
                                              type: string
                                              description: Email address of the customer.
                                            type:
                                              type: string
                                              description: Customer type specified by the merchant.
                                            phone:
                                              description: Phone of the customer.
                                              type: object
                                              required:
                                                - number
                                              properties:
                                                countryCode:
                                                  type: string
                                                  pattern: ^\+?[0-9]+$
                                                  description: International prefix of the phone, if known separately.
                                                number:
                                                  type: string
                                                  pattern: ^[0-9]+$
                                                  description: The local number of the phone, such that `countryCode` + `number` can be dialed.
                                            birthDate:
                                              type: string
                                              format: date
                                              description: Date of birth of the customer.
                                            language:
                                              type: string
                                              description: POSIX locale string identifying the language used to communicate to the customer.
                                              pattern: ^[a-z]{2}(_[A-Z]+)?$
                                            country:
                                              description: Country of registration the customer. Can be different than the order and delivery countries.
                                              type: object
                                              required:
                                                - code
                                              properties:
                                                code:
                                                  type: string
                                                  description: ISO 3166-1 alpha-2 country code.
                                                  pattern: ^[A-Z]{2}$
                                                iso3:
                                                  type: string
                                                  description: ISO 3-letter country code. Returned by Payrails, but not interpreted in requests.
                                                  pattern: ^[A-Z]{3}$
                                                name:
                                                  type: string
                                                  description: The English name of the country. Returned by Payrails, but not interpreted in requests.
                                            identityCardNumber:
