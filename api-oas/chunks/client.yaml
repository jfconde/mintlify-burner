                                        required:
                                          - amountType
                                    - type: object
                                      description: Fixed amount subscription model.
                                      properties:
                                        amountType:
                                          type: string
                                          enum:
                                            - fixed
                                          description: Subscription charges a fixed amount each cycle. Used by subscription mandates such as Pix Automático.
                                        fixedAmount:
                                          type: string
                                          description: The fixed amount charged each cycle, in the transaction currency.
                                      required:
