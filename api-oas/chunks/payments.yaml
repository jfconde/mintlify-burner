                          description: Machine-friendly error code assigned to the error. Check the full list of possible values [here](https://docs.payrails.com/docs/error-codes#list-of-error-codes).
                        detail:
                          type: string
                          description: Human-readable description about the error, its cause, and resolution.
                        docUrl:
                          type: string
                          description: Link to the specific documentation about this particular `code`.
                        reason:
                          type: object
                          additionalProperties: true
                          description: Metadata providing more details about the reason of the error. The structure of this object varies according to the `code`.
              example:
                errors:
                  - id: a24bc325-3929-4d9d-9c08-b3aa532685b7
                    code: request.rate-limit
                    detail: Too many requests
                    docUrl: https://docs.payrails.com/docs/error-codes#requestrate-limit
  /payment/payments/{paymentId}:
    get:
      summary: Get payment by ID
      operationId: getPayment
      description: Find a Payment from a given ID.
      tags:
        - Payments
      security:
        - BearerToken:
            - payments:read
      parameters:
        - name: paymentId
          in: path
          description: Identifier of the resource in Payrails.
          required: true
          schema:
            type: string
            format: uuid
          example: d5454c2f-ae5e-44f3-8edf-f6dad64f005f
        - name: includeInstrument
          in: query
          schema:
            type: boolean
            default: false
          description: Boolean indicating if the payment instrument should be included in the response.
        - name: includePaymentToken
          in: query
          schema:
            type: boolean
            default: false
          description: Boolean indicating if the instrument payment token should be included in the response.
        - name: includeProviderAccountDisplayName
          in: query
          schema:
            type: boolean
            default: false
          description: Boolean indicating if the provider account display name should be included in the response.
        - name: includeHolderReference
          in: query
          schema:
            type: boolean
            default: false
          description: Boolean indicating if the holder reference should be included in the response.
      responses:
        '200':
          description: Payment entity found, and all details are included.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - status
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Unique identifier of the Payment in Payrails.
                  status:
                    type: string
                    description: Current status of the Payment in Payrails. More information can be found [here](/docs/payment-status).
                    enum:
                      - Created
                      - Pending
                      - Unknown
                      - Failed
                      - Expired
                      - Preauthorized
                      - Authorized
                      - Canceled
                      - Captured
                      - Refunded
                  createdAt:
                    type: string
                    format: date-time
                    description: Exact date and time when the Payment was created in Payrails. Possibly differs slightly from the date in the PSP.
                  providerId:
                    type: string
                    format: uuid
                    description: Unique identifier of the Provider that was used to process the Payment.
                  paymentMethodType:
                    type: string
                    description: Type of payment method used to process the payment.
                  providerIntegrationType:
                    type: string
                    description: Type of integration used to process the payment (in case the payment provider supports multiple).
                  providerName:
                    type: string
                    description: Name of the Provider that was used to process the Payment, e.g. Adyen, Checkout, Stripe.
                  providerReference:
                    type: string
                    description: Unique identifier of the Payment in an external system, e.g. PSP.
                  providerConfigId:
                    type: string
                    format: uuid
                    description: Unique identifier of the merchant-specific Provider Configuration that was used to process the Payment. This can include the set of credentials used, the merchant account, country, vertical, etc.
                  holderId:
                    type: string
                    format: uuid
                    description: Unique identifier of the Holder that is involved in the Payment.
                  amount:
                    type: object
                    required:
                      - value
                      - currency
                    properties:
                      value:
                        type: string
                        pattern: '[0-9]+(\.[0-9]+)?'
                        example: '12.50'
                        description: Decimal amount of the major currency unit. Can be any precision.
                      currency:
                        type: string
                        pattern: ^[A-Z]{3}$
                        example: EUR
                        description: ISO 3-letter currency code.
                    description: Amount of the Payment.
                  instrumentId:
                    type: string
                    format: uuid
                    description: Unique identifier of the Instrument that was used for the Payment in Payrails.
                  instrumentTokenId:
                    type: string
                    format: uuid
                    description: Unique identifier of the specific Token inside the Instrument used for the Payment in Payrails.
                  instrument:
                    type: object
                    required:
                      - id
                      - holderId
