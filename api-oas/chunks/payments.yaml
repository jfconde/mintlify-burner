  /payment/payments/{paymentId}/operations:
    get:
      summary: Get Payment Operations by Payment ID
      operationId: getPaymentOperations
      description: Find a payment operation from a given `paymentID`.
      tags:
        - Payments
      security:
        - BearerToken:
            - payments:read
      parameters:
        - name: paymentId
          in: path
          description: Identifier of the resource in Payrails.
          required: true
          schema:
            type: string
            format: uuid
          example: d5454c2f-ae5e-44f3-8edf-f6dad64f005f
        - name: includeLatency
          in: query
          schema:
            type: boolean
          description: Include latency in the response.
        - name: includeLogs
          in: query
          schema:
            type: boolean
          description: Include operation logs in the response.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - result
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Unique identifier of the Payment Operation in Payrails.
                        createdAt:
                          type: string
                          format: date-time
                          description: Exact date and time when the Payment Operation was created in Payrails. Possibly differs slightly from the date in the PSP.
                        updatedAt:
                          type: string
                          format: date-time
                          description: Exact date and time when the Payment Operation was updated in Payrails. Possibly differs slightly from the date in the PSP.
                        paymentId:
                          type: string
                          format: uuid
                          description: Unique identifier of the Payment that this Operation belongs to in Payrails.
                        type:
                          type: string
                          description: Operation Type that was executed in the Provider.
                          enum:
                            - Authorize
                            - Preauthorize
                            - Capture
                            - Cancel
                            - Refund
                            - Credit
                            - SendNotification
                            - CaptureNotification
                            - RefundNotification
                            - CancelNotification
                            - AuthorizeNotification
                            - ChargebackNotification
                            - ChargebackReverseNotification
                            - Get
                            - Search
                            - GetToken
                            - Tokenize
                            - DisableToken
                            - Register
                            - Generate3DS
                            - Validate3DS
                            - PayerAuthInit
                            - PayerAuthCheckEnroll
                            - PayerAuthValidate
                            - RefundFailedNotification
                            - RefundReversedNotification
                            - CaptureFailedNotification
                            - ValidateRedirect
                            - RefundNotificationUpdated
                        reason:
                          type: string
                          description: Reason why the operation was done.
                        providerReference:
                          type: string
                          description: Unique identifier of the Payment Operation in an external system. Some PSPs provide a specific ID for each update in the Payment, but most of them use the same as the original Payment.
                        paymentStatus:
                          type: string
                          description: The payment status just after the operation done.
                        amount:
                          type: object
                          required:
                            - value
                            - currency
                          properties:
                            value:
                              type: string
                              pattern: '[0-9]+(\.[0-9]+)?'
                              example: '12.50'
                              description: Decimal amount of the major currency unit. Can be any precision.
                            currency:
                              type: string
                              pattern: ^[A-Z]{3}$
                              example: EUR
                              description: ISO 3-letter currency code.
                        result:
                          type: string
                          description: Result of the Operation according to Payrails mapping from the provider response.
                          enum:
                            - Success
                            - Accepted
                            - Pending
                            - HTTPRedirectRequired
                            - FormRedirectRequired
                            - Unknown
                            - UnexpectedProviderResponse
                            - ProviderUnknownError
                            - ProviderConnectionError
                            - Timeout
                            - ProviderTimeout
                            - GenericRejection
                            - FraudRisk
                            - DuplicateOperation
                            - OperationNotAllowed
                            - InstrumentNotAllowed
                            - InvalidInstrument
                            - InsufficientBalance
                            - BlockedInstrument
                            - ExpiredInstrument
                            - ValidationError
                            - ParamsError
                            - ProviderConfigError
                            - InvalidSignature
                            - InternalServerError
                            - PayerCanceled
                            - AuthenticationError
                            - AuthenticationRequired
                            - LimitExceeded
                            - PaymentMethodNotSupported
                            - AuthorizationRevoked
                        responseCode:
                          type: string
                          description: Original response code from the PSP, which Payrails interpreted for the result field.
                        requiredActionDetails:
                          type: object
                          description: In case a Provider requests an action to continue executing an Operation, this object contains the necessary information for it.
                          properties:
                            redirectUrl:
                              type: string
                              description: The URL that the Merchant should redirect the user to.
                            redirectMethod:
                              type: string
                              description: The HTTP method that should be used when redirecting to the `redirectUrl`.
                              enum:
                                - GET
                                - POST
                            parameters:
                              type: object
                              description: Map of parameters that are necessary for the redirection. In case the `redirectMethod` is `GET`, these parameters can be appended in the query string, but if it's `POST`, they should be sent via form.
                              additionalProperties:
                                type: string
                        errorDetails:
                          type: string
                          description: Error details from the provider.
                        acquirerReference:
                          type: string
                          description: Acquirer Reference Number (ARN) for the Payment Operation (only Refunds and Captures), which we receive from some of the Provider.
                        workspaceId:
                          type: string
                          format: uuid
                          description: Workspace ID that the workflow configuration belongs to.
                        operationLogs:
                          type: array
                          items:
                            type: object
                            description: Whenever there is an interaction with an external provider, Payrails records a Log to keep the exact information about what was sent and received.
                            properties:
                              id:
                                type: string
                                format: uuid
                                description: Unique identifier of the Payment Operation Log in Payrails.
                              createdAt:
                                type: string
                                format: date-time
                                description: Exact date and time when the Payment Operation Log was created in Payrails. Possibly differs slightly from the date in the PSP.
                              operationId:
                                type: string
                                format: uuid
                                description: Unique identifier of the Payment Operation that this Log belongs to in Payrails.
                              input:
                                type: string
                                description: Original request object sent to the Provider.
                              output:
                                type: string
                                description: Original response object received from the Provider.
                              workspaceId:
                                type: string
                                format: uuid
                                description: Workspace ID that the workflow configuration belongs to.
                          description: List of operation logs associated with this operation.
                        providerLatency:
                          type: string
