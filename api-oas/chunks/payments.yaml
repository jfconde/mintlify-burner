    get:
      summary: Get Payment Operation Logs by Payment Operation ID
      operationId: getPaymentOperationLogs
      description: Find payment operation logs from a given `operationID`.
      tags:
        - Payments
      security:
        - BearerToken:
            - payments:read
      parameters:
        - name: paymentId
          in: path
          description: Identifier of the resource in Payrails.
          required: true
          schema:
            type: string
            format: uuid
          example: d5454c2f-ae5e-44f3-8edf-f6dad64f005f
