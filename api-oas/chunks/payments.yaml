                  instrumentToken:
                    type: object
                    required:
                      - id
                      - instrumentId
                      - providerId
                      - reference
                      - status
                      - type
                      - createdAt
                      - updatedAt
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Id of the token in Payrails.
                      createdAt:
                        type: string
                        format: date-time
                        description: Date and time when the Token was created in Payrails.
                      updatedAt:
                        type: string
                        format: date-time
                        description: When the Token was last updated.
                      instrumentId:
                        type: string
                        format: uuid
                        description: Id of the payment instrument the token belongs to.
                      status:
                        type: string
                        description: Status of the token.
                        enum:
                          - created
                          - enabled
                          - disabled
                          - deleted
                      type:
                        type: string
                        description: Type of the token.
                        enum:
                          - network
                          - vault
                          - psp
                          - networkOffers
                          - networkGateway
                      providerId:
                        type: string
                        format: uuid
                        description: Id of the provider the token belongs to.
                      providerConfigId:
                        type: string
                        format: uuid
                        description: Id of the configuration in the provider the token belongs to.
                      reference:
                        type: string
                        description: Unique identifier of the token in the provider's system.
                      meta:
                        description: Any merchant or provider-specific data that should be stored for context in the token.
                        type: object
                        additionalProperties: true
                    description: Optionally included details about the instrument token used for the payment.
                  transactionReference:
                    type: string
                    description: Merchant-specific identifier of the execution. This can be used for searching for the Payment later.
                  transactionElementReference:
                    type: string
                    description: Identifier of the step in the Workflow that led to this Payment.
                  pspRedirectUrl:
                    type: string
                    description: In case a redirection process is needed during the Payment, this is the URL where the PSP requested Payrails to redirect the user to.
                  capturedAmount:
                    type: object
                    required:
                      - value
                      - currency
                    properties:
                      value:
                        type: string
                        pattern: '[0-9]+(\.[0-9]+)?'
                        example: '12.50'
                        description: Decimal amount of the major currency unit. Can be any precision.
                      currency:
                        type: string
                        pattern: ^[A-Z]{3}$
                        example: EUR
                        description: ISO 3-letter currency code.
                    description: Amount that was captured from the Payment. If no capture is initiated for the payment, the value will be 0 until a successful capture occurs.
                  refundedAmount:
                    type: object
                    required:
                      - value
                      - currency
                    properties:
                      value:
                        type: string
                        pattern: '[0-9]+(\.[0-9]+)?'
                        example: '12.50'
                        description: Decimal amount of the major currency unit. Can be any precision.
                      currency:
                        type: string
                        pattern: ^[A-Z]{3}$
                        example: EUR
                        description: ISO 3-letter currency code.
                    description: Amount that was refunded from the Payment. If multiple partial refunds have been made, this will be the sum of them. If no refund is initiated for the payment, the value will remain 0 until a successful refund occurs.
                  merchantReturnUrl:
                    type: string
                    description: In case a redirection process is needed during the Payment, Payrails will return to this merchant-specific URL after it finished.
                  merchantReference:
                    type: string
                    description: Merchant-provided reference for the Execution. Commonly, the identifier of the order on the Merchant's system.
                  meta:
                    type: object
                    description: Metadata for the context of an execution. Includes Payrails-defined structures for most common fields used in workflows, but can also be extended by merchant or provider-specific fields. For more information, visit our [Meta Fields guide](https://docs.payrails.com/docs/configure-meta-fields-for-your-providers).
                    additionalProperties: true
                    properties:
                      order:
                        type: object
                        description: The order being placed on your system.
                        properties:
                          reference:
                            type: string
                            description: Order reference number sent by the merchant. Defaults to `merchantReference` in the execution if not specified.
                          description:
                            type: string
                            description: A human-readable name or description of this order.
                          softDescriptor:
                            type: string
                            description: Text that should appear in the bank statement of the customer. Can be requested, but keep in mind that some providers and issuers don't allow you to change this.
                          storeId:
                            type: string
                            description: Order Store ID identifies the particular store associated with this order.
                          placement:
                            type: object
                            description: Data about where the order was placed.
                            properties:
                              country:
                                description: Country in which the customer placed the order.
                                type: object
                                required:
                                  - code
                                properties:
