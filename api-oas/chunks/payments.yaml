                                          - discount
                                          - tax
                                      quantity:
                                        type: integer
                                        description: How many instances of this item are part of the order.
                                      unitPrice:
                                        description: How much does a unit of the item cost.
                                        type: object
                                        required:
                                          - value
                                          - currency
                                        properties:
                                          value:
                                            type: string
                                            pattern: '[0-9]+(\.[0-9]+)?'
