                                          currency:
                                            type: string
                                            pattern: ^[A-Z]{3}$
                                            example: EUR
                                            description: ISO 3-letter currency code.
                                      total:
                                        description: Cost of unit price multiplied by quantity with the tax and discount applied.
                                        type: object
                                        required:
                                          - value
                                          - currency
                                        properties:
                                          value:
                                            type: string
                                            pattern: '[0-9]+(\.[0-9]+)?'
                                            example: '12.50'
                                            description: Decimal amount of the major currency unit. Can be any precision.
