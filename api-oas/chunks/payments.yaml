openapi: 3.1.0
info:
  version: 1.3.15
  title: Payrails API Reference
  contact:
    name: Payrails
    url: https://www.payrails.com
    email: tech@payrails.com
  license:
    name: Payrails GmbH
    url: https://www.payrails.com/
  description: |
    ---
    Payrails provides a collection of APIs that enable you to process and manage payments. Our APIs accept and return JSON in the HTTP body, and return standard HTTP response codes. You can consume the APIs directly using your favorite HTTP/REST library.
servers:
  - url: https://api.staging.payrails.io
    description: Payrails environment.
security:
  - ApiKey: []
tags:
  - name: Payments
    description: A [Payment](/guides/whats-payrails/payments/) in Payrails is a collection of operations over time, that is created by a workflow execution and followed by the workflow actions. In this section, you can list all the payments or a single one to learn about the details of involved payment methods, instruments, providers, statuses and more.
paths:
  /payment/payments:
    get:
      summary: Search & list payments
      operationId: listPayments
      description: Fetch a list of payments.
      security:
        - BearerToken:
            - payments:read
      tags:
        - Payments
      parameters:
        - name: includeInstrument
          in: query
          schema:
            type: boolean
            default: false
          description: Boolean indicating if the payment instrument should be included in the response.
        - name: includeProviderAccountDisplayName
          in: query
          schema:
            type: boolean
            default: false
          description: Boolean indicating if the provider account display name should be included in the response.
        - name: includePaymentToken
          in: query
          schema:
            type: boolean
            default: false
          description: Boolean indicating if the instrument payment token should be included in the response.
        - name: includeHolderReference
          in: query
          schema:
            type: boolean
            default: false
          description: Boolean indicating if the holder reference should be included in the response.
        - name: filter[paymentId]
          in: query
          schema:
            type: string
          description: Filter for a list of payments by payment ID.
        - name: filter[providerId]
          in: query
          schema:
            type: string
          description: Filter for a list of payments by provider ID.
        - name: filter[providerConfigId]
          in: query
          schema:
            type: string
          description: Filter for a list of payments by provider config ID.
        - name: filter[providerReference]
          in: query
          schema:
            type: string
          description: Filter for a list of payments by provider reference.
        - name: filter[holderId]
          in: query
          schema:
            type: string
          description: Filter for a list of payments by holder ID.
        - name: filter[holderReference]
          in: query
          schema:
            type: string
          description: Filter for a list of payments by holder reference.
        - name: filter[transactionReference]
          in: query
          schema:
            type: string
          description: Filter for a list of payments by transaction reference.
        - name: filter[merchantReference]
          in: query
          schema:
            type: string
          description: Filter for a list of payments by merchant reference.
        - name: filter[processingType]
          in: query
          schema:
            type: string
          description: Filter for a list of payments by payment processing type.
        - name: filter[captureMode]
          in: query
          schema:
            type: string
          description: Filter for a list of payments by capture mode. Capture mode defines if money is captured instantly, with delay or manually.
        - name: filter[status]
          in: query
          schema:
            type: string
          description: Filter for a list of payments by latest payment status.
        - name: filter[anyReference]
          in: query
          schema:
            type: string
          description: Filter for a list of payments by any reference.
        - name: filter[tokenType]
          in: query
          schema:
            type: string
            description: Type of the token.
            enum:
              - network
              - vault
              - psp
              - networkOffers
              - networkGateway
          description: Filter for a list of payments by instrument token type.
        - name: filter[instrumentId]
          in: query
          schema:
            type: string
          description: Filter for a list of payments by instrument ID.
        - name: filter[instrumentBin]
          in: query
          schema:
            type: string
          description: Filter for a list of payments by instrument BIN.
        - name: filter[instrumentSuffix]
          in: query
          schema:
            type: string
          description: Filter for a list of payments by instrument suffix.
        - name: filter[instrumentNetwork]
          in: query
          schema:
            type: string
          description: Filter for a list of payments by card network.
        - name: filter[instrumentLocalNetwork]
          in: query
          schema:
            type: string
          description: Filter for a list of payments by card network.
        - name: filter[instrumentIssuer]
          in: query
          schema:
            type: string
          description: Filter for a list of payments by instrument issuer.
        - name: filter[instrumentIssuerCountry]
          in: query
          schema:
            type: string
          description: Filter for a list of payments by instrument issuer country.
        - name: filter[instrumentFutureUsage]
          in: query
          schema:
            type: string
          description: Filter for a list of payments by instrument future usage.
        - name: filter[authorizationFailureResult]
          in: query
          schema:
            type: string
          description: Filter for a list of payments by the authorization failure result.
        - name: filter[workspaceId]
          in: query
          description: Filter by Workspace ID.
          schema:
            type: string
        - name: filter[paymentMethodType]
          in: query
          schema:
            type: string
          description: Filter for a list of payments by payment method.
        - name: filter[customerEmail]
          in: query
          schema:
            type: string
          description: Filter for a list of payments by customer email.
        - name: filter[createdAt]
          in: query
          description: |
            Filter by `createdAt` field using interval notation.

            `1973-02-03T04:32:11.596Z` - exact date value

            `(1973-02-03T04:32:11.596Z` - after the date excluding it

            `[1973-02-03T04:32:11.596Z` - after the date including it

            `1973-02-03T04:32:11.596Z)` - before the date excluding it

            `1973-02-03T04:32:11.596Z]` - before the date including it

            `(1973-02-03T04:32:11.596Z,1973-04-03T03:20:11.436Z)` - between two dates excluding both

            `(1973-02-03T04:32:11.596Z,1973-04-03T03:20:11.436Z]` - between two dates excluding on the left

            `[1973-02-03T04:32:11.596Z,1973-04-03T03:20:11.436Z)` - between two dates excluding on the right

            `[1973-02-03T04:32:11.596Z,1973-04-03T03:20:11.436Z]` - between two dates including both.
          schema:
            type: string
            example: '[2026-04-01T00:00:00Z,2026-05-01T00:00:00Z)'
        - name: page[cursor]
          in: query
          description: Search collection items from that cursor.
          required: false
          schema:
            type: string
            description: Cursor for paging results.
          example: 9wkueqcavq
        - name: page[after]
          in: query
          description: Search collection items after that cursor.
          required: false
          schema:
            type: string
            description: Cursor for paging results.
          example: xk2h55zsy5
        - name: page[before]
          in: query
          description: Search collection items before that cursor.
          required: false
          schema:
            type: string
            description: Cursor for paging results.
          example: 9wkueqcavq
        - name: page[size]
          in: query
          description: Length of the collection to search.
          required: false
          schema:
            type: integer
            format: int32
          example: 20
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - links
                  - results
                properties:
                  links:
                    required:
                      - self
                    properties:
                      self:
                        type: string
                      prev:
                        type: string
                      next:
                        type: string
                      first:
                        type: string
                      last:
                        type: string
                  results:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - status
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Unique identifier of the Payment in Payrails.
                        status:
                          type: string
                          description: Current status of the Payment in Payrails. More information can be found [here](/docs/payment-status).
                          enum:
                            - Created
                            - Pending
                            - Unknown
                            - Failed
                            - Expired
                            - Preauthorized
                            - Authorized
                            - Canceled
                            - Captured
                            - Refunded
                        createdAt:
                          type: string
                          format: date-time
                          description: Exact date and time when the Payment was created in Payrails. Possibly differs slightly from the date in the PSP.
                        providerId:
                          type: string
                          format: uuid
                          description: Unique identifier of the Provider that was used to process the Payment.
                        paymentMethodType:
                          type: string
                          description: Type of payment method used to process the payment.
                        providerIntegrationType:
                          type: string
                          description: Type of integration used to process the payment (in case the payment provider supports multiple).
                        providerName:
                          type: string
                          description: Name of the Provider that was used to process the Payment, e.g. Adyen, Checkout, Stripe.
                        providerReference:
                          type: string
                          description: Unique identifier of the Payment in an external system, e.g. PSP.
                        providerConfigId:
                          type: string
                          format: uuid
                          description: Unique identifier of the merchant-specific Provider Configuration that was used to process the Payment. This can include the set of credentials used, the merchant account, country, vertical, etc.
                        holderId:
                          type: string
                          format: uuid
                          description: Unique identifier of the Holder that is involved in the Payment.
                        amount:
                          type: object
                          required:
                            - value
                            - currency
                          properties:
                            value:
                              type: string
                              pattern: '[0-9]+(\.[0-9]+)?'
                              example: '12.50'
                              description: Decimal amount of the major currency unit. Can be any precision.
                            currency:
                              type: string
                              pattern: ^[A-Z]{3}$
                              example: EUR
                              description: ISO 3-letter currency code.
                          description: Amount of the Payment.
                        instrumentId:
                          type: string
                          format: uuid
                          description: Unique identifier of the Instrument that was used for the Payment in Payrails.
                        instrumentTokenId:
                          type: string
                          format: uuid
                          description: Unique identifier of the specific Token inside the Instrument used for the Payment in Payrails.
                        instrument:
                          type: object
                          required:
                            - id
                            - holderId
                            - paymentMethod
                            - status
                            - createdAt
                            - updatedAt
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: Id of the instrument.
                            createdAt:
                              type: string
                              format: date-time
                              description: Date and time when the Instrument was created in Payrails.
                            updatedAt:
                              type: string
                              format: date-time
                              description: When the Instrument was last updated.
                            holderId:
                              type: string
                              format: uuid
                              description: Unique identifier of the Holder in Payrails.
                            paymentMethod:
                              type: string
                              description: Represents the payment method type.
                              enum:
                                - alexBankMa7fazty
                                - applePay
                                - audi2pay
                                - bankAccount
                                - card
                                - 2c2p
                                - vietQR
                                - cibSmartWallet
                                - easypaisa
                                - etisalatCash
                                - fawryMobileWallet
                                - fawryPay
                                - googlePay
                                - jazzCash
                                - nbePhoneCash
                                - orangeCash
                                - payPal
                                - qnbEWallet
                                - weCash
                                - genericRedirect
                                - alfa
                                - konnect
                                - eftPro
                                - netBanking
                                - upi
                                - cashFreeWallet
                                - paytmWallet
                                - phonePe
                            status:
                              type: string
                              description: Status of the instrument.
                              enum:
                                - created
                                - deleted
                                - enabled
                                - disabled
                                - transient
                            displayName:
                              type: string
                              description: Instrument name suitable for display.
                            description:
                              type: string
                              description: Description of the instrument.
                            default:
                              type: boolean
                              description: True if this instrument is set as default for the holder.
                              nullable: true
                            merchantReference:
                              type: string
                              description: Merchant-provided reference for the instrument.
                            fingerprint:
                              type: string
                              description: System-wide unique identifier of the Instrument. If two Holders have the same instrument stored, this value will be the same for both, but the instrument and token IDs will be different. Cannot be used for payments, should only be used for analytics and fraud prevention.
                            futureUsage:
                              type: string
                              description: Represents the future usage to define the payment flows that the stored instrument will be used for.
                              enum:
                                - Subscription
                                - CardOnFile
                                - UnscheduledCardOnFile
                            networkTransactionReference:
                              type: string
                              description: Identifier of the initial payment made with this instrument on the Networks, e.g. Mastercard Trace ID or Visa Transaction ID.
                            data:
                              description: Type-specific information about the instrument.
                              anyOf:
