    post:
      summary: Create an instrument
      description: Create a payment instrument.
      operationId: createInstrument
      tags:
        - Instruments
      security:
        - BearerToken:
            - instruments:create
      parameters:
        - name: x-idempotency-key
          in: header
          description: |
            Idempotency key to be used.
            Sending again the same key would return the same result without re-executing the update.
          required: true
          schema:
            type: string
            format: uuid
          example: 91874e4d-81e9-4486-aee4-ee1de84da890
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - paymentMethod
              properties:
                holderId:
                  type: string
                  format: uuid
                  description: Unique identifier of the Holder in Payrails. At least one of `holderId` or `holderReference` values have to be provided in the request.
                holderReference:
                  type: string
                  description: Merchant-provided reference for the transaction counterparty, i.e. the paying consumer. At least one of `holderReference` or `holderId` values have to be provided in the request.
                paymentMethod:
                  type: string
                  description: Represents the payment method type.
                  enum:
                    - googlePay
                    - applePay
                    - card
                    - payPal
                    - bankAccount
                futureUsage:
                  type: string
                  description: Represents the future usage to define the payment flows that the stored instrument will be used for.
                  enum:
                    - Subscription
                    - CardOnFile
                    - UnscheduledCardOnFile
                description:
                  type: string
                  description: Human-friendly description of the Instrument.
                  example: Main card, mom's card, company card
                merchantReference:
                  type: string
                  description: Merchant-provided reference for the instrument.
                networkTransactionReference:
                  type: string
                  description: Identifier of the initial payment made with this instrument on the Networks, e.g. Mastercard Trace ID or Visa Transaction ID.
                storeInstrument:
                  type: boolean
                  description: True if the holder wants to store the instrument for future use when payment is completed.
                default:
                  type: boolean
                  description: True if the holder wants to make this instrument as default.
                  nullable: true
                workspaceId:
                  type: string
                  format: uuid
                  description: Workspace identifier. When a merchant has multiple network token provider configs, this determines which workspace-scoped config is used for network token provisioning.
                provisionNetworkToken:
                  type: boolean
                  description: True if the merchant wants to provision a network token for this instrument.
                data:
                  description: Type-specific information about the instrument.
                  anyOf:
                    - title: Card
                      type: object
                      description: Data specific to a Card instrument.
                      required:
                        - network
