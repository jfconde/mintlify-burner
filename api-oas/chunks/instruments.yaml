openapi: 3.1.0
info:
  version: 1.3.15
  title: Payrails API Reference
  contact:
    name: Payrails
    url: https://www.payrails.com
    email: tech@payrails.com
  license:
    name: Payrails GmbH
    url: https://www.payrails.com/
  description: |
    ---
    Payrails provides a collection of APIs that enable you to process and manage payments. Our APIs accept and return JSON in the HTTP body, and return standard HTTP response codes. You can consume the APIs directly using your favorite HTTP/REST library.
servers:
  - url: https://api.staging.payrails.io
    description: Payrails environment.
security:
  - ApiKey: []
tags:
  - name: Instruments
    description: Payment instruments are specific instances of a payment method that belong to the holder executing the workflow. They can be a previously stored card, a new card that was typed in a form, a phone number, an IBAN, or some way to fetch an account in a provider (like PayPal or AliPay).
paths:
  /payment/instruments:
    get:
      summary: Search & list instruments
      operationId: listInstruments
      description: Fetch a list of payment instruments for the given query parameters.
      tags:
        - Instruments
      security:
        - BearerToken:
            - instruments:list
      parameters:
        - name: includeHolderReference
          in: query
          schema:
            type: boolean
            default: false
          description: Boolean indicating if the holder reference should be included in the response.
        - name: filter[holderReference]
          in: query
          schema:
            type: string
          description: Filter for a list of instruments by holder reference.
        - name: filter[holderId]
          in: query
          schema:
            type: string
          description: Filter for a list of instruments by holder id.
        - name: filter[status]
          in: query
          schema:
            type: string
          description: Filter for a list of instruments by latest instruments status.
        - name: filter[onlyWithTokens]
          in: query
          schema:
            type: boolean
          description: Filter for a list of instruments only ones with tokens.
        - name: filter[tokenType]
          in: query
          schema:
            type: string
          description: Filter for a list of instruments by token type.
        - name: filter[tokenStatus]
          in: query
          schema:
            type: string
          description: Filter for a list of instruments by token status.
        - name: filter[futureUsage]
          in: query
          schema:
            type: string
          description: Filter for a list of instruments by future usage.
        - name: filter[bin]
          in: query
          schema:
            type: string
          description: Filter for a list of instruments by BIN.
        - name: filter[suffix]
          in: query
          schema:
            type: string
          description: Filter for a list of instruments by suffix.
        - name: filter[network]
          in: query
          schema:
            type: string
          description: Filter for a list of instruments by card network.
        - name: filter[issuer]
          in: query
          schema:
            type: string
          description: Filter for a list of instruments by issuer.
        - name: filter[issuerCountry]
          in: query
          schema:
            type: string
          description: Filter for a list of instruments by country name.
        - name: filter[paymentMethodType]
          in: query
          schema:
            type: string
          description: Filter for a list of instruments by payment method.
        - name: filter[createdAt]
          in: query
          description: |
            Filter by `createdAt` field using interval notation.

            `1973-02-03T04:32:11.596Z` - exact date value

            `(1973-02-03T04:32:11.596Z` - after the date excluding it

            `[1973-02-03T04:32:11.596Z` - after the date including it

            `1973-02-03T04:32:11.596Z)` - before the date excluding it

            `1973-02-03T04:32:11.596Z]` - before the date including it

            `(1973-02-03T04:32:11.596Z,1973-04-03T03:20:11.436Z)` - between two dates excluding both

            `(1973-02-03T04:32:11.596Z,1973-04-03T03:20:11.436Z]` - between two dates excluding on the left

            `[1973-02-03T04:32:11.596Z,1973-04-03T03:20:11.436Z)` - between two dates excluding on the right

            `[1973-02-03T04:32:11.596Z,1973-04-03T03:20:11.436Z]` - between two dates including both.
          schema:
            type: string
            example: '[2026-04-01T00:00:00Z,2026-05-01T00:00:00Z)'
        - name: page[cursor]
          in: query
          description: Search collection items from that cursor.
          required: false
          schema:
            type: string
            description: Cursor for paging results.
          example: 9wkueqcavq
        - name: page[after]
          in: query
          description: Search collection items after that cursor.
          required: false
          schema:
            type: string
            description: Cursor for paging results.
          example: xk2h55zsy5
        - name: page[before]
          in: query
          description: Search collection items before that cursor.
          required: false
          schema:
            type: string
            description: Cursor for paging results.
          example: 9wkueqcavq
        - name: page[size]
          in: query
          description: Length of the collection to search.
          required: false
          schema:
            type: integer
            format: int32
          example: 20
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  paging:
                    type: object
                    description: Paging information about the results.
                    properties:
                      next:
                        type: string
                        example: '?createdAtOrAfter=2022-02-11+00%3A00%3A00&createdAtOrBefore=2022-02-11+20%3A17%3A52.885&limit=50&pagingIdBefore=payment-acceptance%2Fa43c3080-7357-582b-bed3-7f68606c708b'
