  /payment/instruments/{instrumentId}/provisionNetworkToken:
    post:
      summary: Provision a Network Token
      description: Provision a network token for a given payment instrument.
      operationId: provisionNetworkTokenPublic
      tags:
        - Instruments
      security:
        - BearerToken:
            - networktokens:create
      parameters:
        - name: x-idempotency-key
          in: header
          description: |
            Idempotency key to be used.
            Sending again the same key would return the same result without re-executing the update.
          required: true
          schema:
            type: string
            format: uuid
          example: 91874e4d-81e9-4486-aee4-ee1de84da890
