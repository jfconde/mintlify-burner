    patch:
      summary: Update an instrument
      description: Update an instrument.
      operationId: updateInstrument
      security:
        - BearerToken:
            - instruments:update
      tags:
        - Instruments
      parameters:
        - name: x-idempotency-key
          in: header
          description: |
            Idempotency key to be used.
            Sending again the same key would return the same result without re-executing the update.
          required: true
          schema:
            type: string
            format: uuid
          example: 91874e4d-81e9-4486-aee4-ee1de84da890
        - name: instrumentId
          in: path
          description: Identifier of the resource in Payrails.
          required: true
          schema:
            type: string
            format: uuid
          example: d5454c2f-ae5e-44f3-8edf-f6dad64f005f
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - enabled
                    - disabled
                  description: New status of the Instrument. If you want to change to `"deleted"`, you should use the `DELETE` endpoint instead. Also, note that some status are internal and cannot be changed via API, e.g. `transient`, etc. Status update requests can also be rejected if an instrument status cannot be changed to the desired one, e.g. `deleted` instruments.
                networkTransactionReference:
                  type: string
                  description: Identifier of the initial payment made with this instrument on the Networks, e.g. Mastercard Trace ID or Visa Transaction ID.
                merchantReference:
                  type: string
                  description: Merchant-provided reference for the instrument.
                paymentMethod:
                  type: string
                  enum:
                    - applePay
                    - card
                    - googlePay
                    - payPal
                  description: New payment method of the instrument. Only the methods supporting instruments are accepted.
                default:
                  type: boolean
                  description: True if the holder wants to make this instrument as default.
                  nullable: true
            examples:
              default:
                description: Update multiple fields.
                value:
                  status: enabled
                  networkTransactionReference: '987654321234567'
                  merchantReference: ref_C47C47
              status:
                description: Update only status.
                value:
                  status: disabled
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - type: object
                    required:
                      - id
                      - holderId
                      - paymentMethod
                      - status
                      - createdAt
                      - updatedAt
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Id of the instrument.
                      createdAt:
                        type: string
                        format: date-time
                        description: Date and time when the Instrument was created in Payrails.
                      updatedAt:
                        type: string
                        format: date-time
                        description: When the Instrument was last updated.
                      holderId:
                        type: string
                        format: uuid
                        description: Unique identifier of the Holder in Payrails.
                      paymentMethod:
                        type: string
                        description: Represents the payment method type.
                        enum:
                          - alexBankMa7fazty
                          - applePay
                          - audi2pay
                          - bankAccount
                          - card
                          - 2c2p
                          - vietQR
                          - cibSmartWallet
                          - easypaisa
                          - etisalatCash
                          - fawryMobileWallet
                          - fawryPay
                          - googlePay
                          - jazzCash
                          - nbePhoneCash
                          - orangeCash
                          - payPal
                          - qnbEWallet
                          - weCash
                          - genericRedirect
                          - alfa
                          - konnect
                          - eftPro
                          - netBanking
                          - upi
                          - cashFreeWallet
                          - paytmWallet
                          - phonePe
                      status:
                        type: string
                        description: Status of the instrument.
                        enum:
                          - created
                          - deleted
                          - enabled
                          - disabled
                          - transient
                      displayName:
                        type: string
                        description: Instrument name suitable for display.
                      description:
                        type: string
                        description: Description of the instrument.
                      default:
                        type: boolean
                        description: True if this instrument is set as default for the holder.
                        nullable: true
                      merchantReference:
                        type: string
                        description: Merchant-provided reference for the instrument.
                      fingerprint:
                        type: string
                        description: System-wide unique identifier of the Instrument. If two Holders have the same instrument stored, this value will be the same for both, but the instrument and token IDs will be different. Cannot be used for payments, should only be used for analytics and fraud prevention.
                      futureUsage:
                        type: string
                        description: Represents the future usage to define the payment flows that the stored instrument will be used for.
                        enum:
