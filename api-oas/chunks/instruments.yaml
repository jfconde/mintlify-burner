  /payment/instruments/{instrumentId}:
    get:
      tags:
        - Instruments
      summary: Get an instrument by ID
      description: Get instrument by ID.
      operationId: getInstrument
      security:
        - BearerToken:
            - instruments:read
      parameters:
        - name: instrumentId
          in: path
          description: Identifier of the resource in Payrails.
          required: true
          schema:
            type: string
            format: uuid
          example: d5454c2f-ae5e-44f3-8edf-f6dad64f005f
        - name: includeTokens
          in: query
          schema:
            type: boolean
            default: false
          description: Boolean indicating if token list should be included in the response.
        - name: includeHolderReference
          in: query
          schema:
            type: boolean
            default: false
          description: Boolean indicating if the holder reference should be included in the response.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - type: object
                    required:
                      - id
                      - holderId
                      - paymentMethod
                      - status
                      - createdAt
                      - updatedAt
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Id of the instrument.
                      createdAt:
                        type: string
                        format: date-time
                        description: Date and time when the Instrument was created in Payrails.
                      updatedAt:
                        type: string
                        format: date-time
                        description: When the Instrument was last updated.
                      holderId:
                        type: string
                        format: uuid
                        description: Unique identifier of the Holder in Payrails.
                      paymentMethod:
                        type: string
                        description: Represents the payment method type.
                        enum:
                          - alexBankMa7fazty
                          - applePay
                          - audi2pay
                          - bankAccount
                          - card
                          - 2c2p
                          - vietQR
                          - cibSmartWallet
                          - easypaisa
                          - etisalatCash
                          - fawryMobileWallet
                          - fawryPay
                          - googlePay
