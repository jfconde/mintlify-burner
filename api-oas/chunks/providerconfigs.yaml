                  hmacKeys:
                    - 4G12RUD2K3AB6KIPZBA6A1T1N2ZDQH5I67X9
              accountName: TestAccountName
              accountDisplayName: TestAccountDisplayName
              workspaces:
                - 7f9f1882-a103-408d-ac96-46a7021e537a
