  /payment/providers/{providerId}/configs/authenticated:
    post:
      summary: Create a provider config with authenticated onboarding
      operationId: createAuthenticatedProviderConfig
      description: Trigger an action to create the provider config after completing an authenticated onboarding flow.
      tags:
        - ProviderConfigs
      security:
        - BearerToken:
            - providerconfigs:create:authenticated
      parameters:
        - name: providerId
          in: path
          description: Identifier of the resource in Payrails.
          required: true
          schema:
            type: string
            format: uuid
          example: d5454c2f-ae5e-44f3-8edf-f6dad64f005f
        - name: x-idempotency-key
          in: header
          description: |
            Idempotency key to be used.
            Sending again the same key would return the same result without re-executing the update.
          required: true
          schema:
            type: string
            format: uuid
          example: 91874e4d-81e9-4486-aee4-ee1de84da890
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required:
                    - accountName
                  properties:
                    id:
                      type: string
                      description: Optional ID for the provider configuration. If not specified, a new ID is automatically generated.
                      format: uuid
                    accountName:
                      type: string
                      description: Account name of the provider.
                      format: string
                      pattern: ^[a-zA-Z0-9_-]*$
                    config:
                      type: object
                    accountDisplayName:
                      type: string
                      description: Account display name of the provider.
                      format: string
                    workspaces:
                      type: array
                      description: List of workspaces that the provider configuration will be assigned.
                      items:
                        type: string
                        format: uuid
                    workspaceId:
                      type: string
                      format: uuid
                      deprecated: true
                      nullable: true
                      description: Deprecated (use workspaces), Workspace ID that the provider configuration will be assigned.
                    additionalData:
                      type: object
                      description: |
                        Custom key-value data included in authorization webhook notifications. Do not store secrets, credentials, or personally identifiable information (PII).
                      additionalProperties:
                        type: string
                - type: object
                  description: Parameters for authenticated provider onboarding. `authentication` carries the credentials returned by the onboarding flow, depending on the authentication mode.
                  required:
                    - authenticationMode
                  properties:
                    authenticationMode:
                      type: string
                      description: Authentication mode used for provider onboarding.
                      enum:
                        - none
                        - oauth
                        - trackingId
                    authentication:
                      type: object
                      description: Provider onboarding credentials returned by the authentication flow.
                      properties:
                        state:
                          type: string
                          description: Signed onboarding state returned from the provider onboarding redirect. Required for the `oauth` and `trackingId` authentication modes; must be empty for `none`.
                        authorizationCode:
                          type: string
                          description: Authorization code returned from the provider onboarding redirect. Used only for the `oauth` authentication mode; must be empty for `none` and `trackingId`.
            example:
              config:
                accountDetails:
                  processingChannelId: pc_0a70d769-9c20-416e-a436-4a323ce7eabf
              accountName: TestAccountName
              accountDisplayName: TestAccountDisplayName
              workspaces:
                - 7f9f1882-a103-408d-ac96-46a7021e537a
              authenticationMode: oauth
              authentication:
                state: '{"merchantName":"demo","providerId":"6c5df4c8-1174-4ef0-b7cb-f0b00a1d4b91","providerConfigId":"32a5c834-1243-4f4d-b5d0-182d2796674b","token":"csrf-token"}'
                authorizationCode: auth_code_123
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - providerId
                  - createdAt
                  - accountName
                  - configSchema
                  - accountDisplayName
                properties:
                  id:
                    type: string
                    description: Unique identifier of the provider config.
                    format: uuid
                  providerId:
                    type: string
                    description: Unique identifier of the provider.
                    format: uuid
                  accountName:
                    type: string
                    description: Account name of the provider.
                    format: string
                    pattern: ^[a-zA-Z0-9_-]*$
                  configSchema:
                    type: string
