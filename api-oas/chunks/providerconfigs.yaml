                          format: uuid
                        providerId:
                          type: string
                          description: Unique identifier of the provider.
                          format: uuid
                        accountName:
                          type: string
                          description: Account name of the provider.
                          format: string
                          pattern: ^[a-zA-Z0-9_-]*$
                        configSchema:
                          type: string
                          description: JSON schema of the provider configuration.
                        createdAt:
                          type: string
                          format: date-time
                          description: Date of creation of the provider config.
                        status:
                          type: string
                          description: The status of the provider config.
                        config:
                          type: object
                        accountDisplayName:
                          type: string
                          description: Account display name of the provider.
                          format: string
                        workspaces:
                          type: array
                          description: Workspaces that the Provider config belongs to.
                          items:
                            type: string
                            format: uuid
                        providerName:
                          type: string
                          description: Name of the provider.
                        providerDisplayName:
                          type: string
                          description: Display name of the provider.
                        notificationUrl:
                          type: string
                          description: Notification URL for this provider config.
                        additionalData:
