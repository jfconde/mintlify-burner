  /payment/providers/{providerId}/configs/{providerConfigId}/onboarding-url:
    post:
      summary: Create a provider config onboarding URL
      operationId: createProviderConfigOnboardingURL
      description: |
        Build a redirect onboarding URL for a provider config. If the provider config does not exist yet, use the same provider config ID later when creating the authenticated provider config.
      tags:
        - ProviderConfigs
      security:
        - BearerToken:
            - providerconfigs:onboardingurl:create
      parameters:
        - name: providerId
          in: path
          description: Identifier of the resource in Payrails.
          required: true
          schema:
            type: string
            format: uuid
          example: d5454c2f-ae5e-44f3-8edf-f6dad64f005f
        - name: providerConfigId
          in: path
          description: Identifier of the resource in Payrails.
          required: true
          schema:
            type: string
            format: uuid
          example: d5454c2f-ae5e-44f3-8edf-f6dad64f005f
        - name: x-idempotency-key
          in: header
          description: |
            Idempotency key to be used.
            Sending again the same key would return the same result without re-executing the update.
          required: true
          schema:
            type: string
            format: uuid
          example: 91874e4d-81e9-4486-aee4-ee1de84da890
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - returnUrl
              properties:
                returnUrl:
                  type: string
                  format: uri
                  description: URL the provider should redirect the user back to after the onboarding flow completes.
            example:
              returnUrl: https://merchant.example.com/connector/callback
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - url
                properties:
                  url:
                    type: string
                    format: uri
                    description: Generated onboarding URL for the provider.
                  authenticationMode:
                    type: string
                    description: Authentication mode used for provider onboarding.
                    enum:
                      - none
                      - oauth
                      - trackingId
                  authentication:
                    type: object
                    description: Provider onboarding credentials returned by the authentication flow.
                    properties:
                      state:
                        type: string
                        description: Signed onboarding state returned from the provider onboarding redirect. Required for the `oauth` and `trackingId` authentication modes; must be empty for `none`.
                      authorizationCode:
                        type: string
                        description: Authorization code returned from the provider onboarding redirect. Used only for the `oauth` authentication mode; must be empty for `none` and `trackingId`.
              example:
                url: https://connect.stripe.com/oauth/authorize?state=test
