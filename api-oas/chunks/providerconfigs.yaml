      summary: List active provider configs
      operationId: listActiveProviderConfigs
      description: Fetch a list of active provider configs.
      tags:
        - ProviderConfigs
      security:
        - BearerToken:
            - providerconfigs:list
      parameters:
        - name: filter[status]
          in: query
          schema:
            type: string
            description: Status of the provider config.
            enum:
              - enabled
              - disabled
              - deleted
              - temporarilyDisabled
          required: false
          description: Filter by provider config status to only find provider configs with this status.
        - name: filter[paymentMethod]
          description: Filter by payment method to only find active providers which support this payment method.
          in: query
          schema:
            type: string
            description: Represents the payment method type.
            enum:
              - alexBankMa7fazty
              - applePay
              - audi2pay
              - bankAccount
              - card
              - 2c2p
              - vietQR
              - cibSmartWallet
              - easypaisa
              - etisalatCash
              - fawryMobileWallet
              - fawryPay
              - googlePay
              - jazzCash
              - nbePhoneCash
              - orangeCash
              - payPal
              - qnbEWallet
              - weCash
              - genericRedirect
              - alfa
              - konnect
              - eftPro
              - netBanking
              - upi
              - cashFreeWallet
              - paytmWallet
              - phonePe
          required: false
        - name: filter[providerType]
          in: query
          schema:
            type: string
            description: Provider type.
            enum:
              - Fraud
              - Payment
              - Payout
              - Vault
              - NetworkOffers
              - ThreeDS
              - NetworkGateway
              - NetworkToken
              - Bin
              - Data
              - Dispute
              - DisputeAlert
              - Tax
          required: false
          description: Filter by provider type to only find active providers of a specific type, e.g. Vault.
        - name: filter[providerName]
          in: query
          schema:
            type: string
          description: Filter for a list of provider configs by provider name.
        - name: filter[accountName]
          in: query
          schema:
            type: string
          description: Filter for a list of provider configs by account name.
        - name: filter[accountDisplayName]
          in: query
          schema:
            type: string
          description: Filter for a list of provider configs by account display name.
        - name: filter[workspaceId]
          in: query
          description: Filter by Workspace ID.
          schema:
            type: string
        - name: includeSchema
          in: query
          schema:
            type: boolean
            default: true
          description: Whether to include the schema of the returned configs.
        - name: page[cursor]
          in: query
          description: Search collection items from that cursor.
          required: false
          schema:
            type: string
            description: Cursor for paging results.
          example: 9wkueqcavq
        - name: page[after]
          in: query
          description: Search collection items after that cursor.
          required: false
          schema:
            type: string
            description: Cursor for paging results.
          example: xk2h55zsy5
        - name: page[before]
          in: query
          description: Search collection items before that cursor.
          required: false
          schema:
            type: string
            description: Cursor for paging results.
          example: 9wkueqcavq
        - name: page[size]
          in: query
          description: Length of the collection to search.
          required: false
          schema:
            type: integer
            format: int32
          example: 20
