  /payment/providers/{providerId}/configs:
    post:
      summary: Create a provider config
      operationId: createProviderConfig
      description: Trigger an action to create the provider config.
      tags:
        - ProviderConfigs
      security:
        - BearerToken:
            - providerconfigs:create
      parameters:
        - name: providerId
          in: path
          description: Identifier of the resource in Payrails.
          required: true
          schema:
            type: string
            format: uuid
          example: d5454c2f-ae5e-44f3-8edf-f6dad64f005f
        - name: x-idempotency-key
          in: header
          description: |
            Idempotency key to be used.
            Sending again the same key would return the same result without re-executing the update.
          required: true
          schema:
            type: string
            format: uuid
          example: 91874e4d-81e9-4486-aee4-ee1de84da890
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - accountName
              properties:
                id:
                  type: string
                  description: Optional ID for the provider configuration. If not specified, a new ID is automatically generated.
                  format: uuid
                accountName:
                  type: string
                  description: Account name of the provider.
                  format: string
                  pattern: ^[a-zA-Z0-9_-]*$
                config:
                  type: object
                accountDisplayName:
                  type: string
                  description: Account display name of the provider.
                  format: string
                workspaces:
                  type: array
                  description: List of workspaces that the provider configuration will be assigned.
                  items:
                    type: string
                    format: uuid
                workspaceId:
                  type: string
                  format: uuid
                  deprecated: true
                  nullable: true
                  description: Deprecated (use workspaces), Workspace ID that the provider configuration will be assigned.
                additionalData:
                  type: object
                  description: |
                    Custom key-value data included in authorization webhook notifications. Do not store secrets, credentials, or personally identifiable information (PII).
                  additionalProperties:
                    type: string
            example:
              config:
                accountDetails:
                  processingChannelId: pc_0a70d769-9c20-416e-a436-4a323ce7eabf
                credentials:
                  clientId: ack_3b2105ac-0190-4e18-a46c-d79ff97a39bc
