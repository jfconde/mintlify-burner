openapi: 3.1.0
info:
  version: 1.3.15
  title: Payrails API Reference
  contact:
    name: Payrails
    url: https://www.payrails.com
    email: tech@payrails.com
  license:
    name: Payrails GmbH
    url: https://www.payrails.com/
  description: |
    ---
    Payrails provides a collection of APIs that enable you to process and manage payments. Our APIs accept and return JSON in the HTTP body, and return standard HTTP response codes. You can consume the APIs directly using your favorite HTTP/REST library.
servers:
  - url: https://api.staging.payrails.io
    description: Payrails environment.
security:
  - ApiKey: []
tags:
  - name: Workspaces
    description: Operations related to managing workspaces.
paths:
  /merchant/workspaces:
    post:
      tags:
        - Workspaces
      summary: Create a workspace
      description: Create a new workspace.
      operationId: createWorkspace
      security:
        - BearerToken:
            - workspaces:create
      parameters:
        - name: x-idempotency-key
          in: header
          description: |
            Idempotency key to be used.
            Sending again the same key would return the same result without re-executing the update.
          required: true
          schema:
            type: string
            format: uuid
          example: 91874e4d-81e9-4486-aee4-ee1de84da890
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Unique name of the Workspace.
                copyProviderConfig:
                  type: object
                  required:
                    - existingWorkspaceID
                  properties:
                    existingWorkspaceID:
                      type: string
                      format: uuid
                      description: Workspace ID from which we want to copy.
                copyWorkflowConfig:
                  type: object
                  required:
                    - existingWorkspaceID
                  properties:
                    existingWorkspaceID:
                      type: string
                      format: uuid
                      description: Workspace ID from which we want to copy.
                copyNotificationConfig:
                  type: object
                  required:
                    - existingWorkspaceID
                  properties:
                    existingWorkspaceID:
                      type: string
                      format: uuid
                      description: Workspace ID from which we want to copy.
                copyUsers:
                  type: object
                  required:
                    - existingWorkspaceID
                  properties:
                    existingWorkspaceID:
                      type: string
                      format: uuid
                      description: Workspace ID from which we want to copy.
            example:
              name: Default Workspace
              copyProviderConfig:
                existingWorkspaceID: 7f9f1882-a103-408d-ac96-46a7021e537a
              copyWorkflowConfig:
                existingWorkspaceID: 7f9f1882-a103-408d-ac96-46a7021e537a
              copyNotificationConfig:
                existingWorkspaceID: 7f9f1882-a103-408d-ac96-46a7021e537a
              copyUsers:
                existingWorkspaceID: 7f9f1882-a103-408d-ac96-46a7021e537a
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - workspace
                properties:
                  workspace:
                    type: object
                    title: Workspace
                    required:
                      - id
                      - name
                      - createdAt
                      - updatedAt
                    properties:
                      id:
                        type: string
                        description: Unique identifier of the Workspace.
                        format: uuid
                      name:
                        type: string
                        description: Unique name of the Workspace configuration.
                      createdBy:
                        type: string
                        description: Email address of the user that created the workspace.
                      updatedBy:
                        type: string
                        description: Email address of the user that updated the workspace.
                      createdAt:
                        type: string
                        format: date-time
                        description: Date of creation of the workspace configuration.
                      updatedAt:
                        type: string
                        format: date-time
                        description: Date of last update of the workspace configuration.
                  copyRequestFailures:
                    type: array
                    description: List of failures happened while copying items from existing workspace.
                    items:
                      type: object
                      required:
                        - existingWorkspaceID
                        - failureMessage
                      properties:
                        existingWorkspaceID:
                          type: string
                          format: uuid
                          description: Workspace ID from which we wanted to copy.
                        failureMessage:
                          type: string
                          description: Reason why that copy request failed.
              example:
                workspace:
                  id: b8fe6271-5d71-4d28-b8e8-89e64acc0c49
                  name: Default Workspace
                  createdAt: '2022-02-03T14:38:40.557Z'
                  updatedAt: '2022-02-03T14:38:40.557Z'
                  createdBy: john.doe@payrails.com
                copyRequestFailures:
                  - existingWorkspaceID: 7f9f1882-a103-408d-ac96-46a7021e537a
                    failureMessage: Failed to copy rulessets from existing workspaces.
                  - existingWorkspaceID: 7f9f1882-a103-408d-ac96-46a7021e537a
                    failureMessage: Failed to copy users from existing workspaces.
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      description: Error struct that includes the error, cause, reason, and possible resolutions. Check the full documentation [here](https://docs.payrails.com/docs/error-codes#error-structure).
                      required:
                        - id
                        - code
                        - detail
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Unique identifier of the error. Please use this value when reporting an issue to our team, so we can help you faster.
                        code:
                          type: string
