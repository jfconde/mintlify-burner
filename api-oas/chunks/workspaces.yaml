  /merchant/workspaces/bulk-create:
    post:
      tags:
        - Workspaces
      summary: Create workspaces
      description: Create workspaces in bulk.
      operationId: createWorkspaces
      security:
        - BearerToken:
            - workspaces:create
      parameters:
        - name: x-idempotency-key
          in: header
          description: |
            Idempotency key to be used.
            Sending again the same key would return the same result without re-executing the update.
          required: true
          schema:
            type: string
            format: uuid
          example: 91874e4d-81e9-4486-aee4-ee1de84da890
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - names
              properties:
                names:
                  type: array
                  description: Unique name of the Workspaces.
                  items:
                    type: string
                renameDefault:
                  type: boolean
                  description: If the default workspace should be renamed with first entry.
            example:
              names:
                - Europe Workspace
                - Asia Workspace
              renameDefault: false
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  createdWorkspaces:
                    type: array
                    items:
                      type: object
                      title: Workspace
                      required:
                        - id
                        - name
                        - createdAt
                        - updatedAt
                      properties:
                        id:
                          type: string
                          description: Unique identifier of the Workspace.
                          format: uuid
                        name:
                          type: string
                          description: Unique name of the Workspace configuration.
                        createdBy:
                          type: string
                          description: Email address of the user that created the workspace.
                        updatedBy:
                          type: string
                          description: Email address of the user that updated the workspace.
                        createdAt:
                          type: string
                          format: date-time
                          description: Date of creation of the workspace configuration.
                        updatedAt:
                          type: string
                          format: date-time
                          description: Date of last update of the workspace configuration.
                  failedWorkspaces:
                    type: array
                    items:
                      type: object
                      required:
                        - name
                        - errorMessage
                      properties:
                        name:
                          type: string
                          description: Name of the workspace.
                        errorMessage:
                          type: string
                          description: Error due to which workspace creation failed.
              example:
                createdWorkspaces:
                  - id: b8fe6271-5d71-4d28-b8e8-89e64acc0c49
                    name: Europe Workspace
                    createdAt: '2022-02-03T14:38:40.557Z'
                    updatedAt: '2022-02-03T14:38:40.557Z'
                    createdBy: john.doe@payrails.com
                  - id: 7f9f1882-a103-408d-ac96-46a7021e537a
                    name: Asia Workspace
                    createdAt: '2022-02-03T14:38:40.557Z'
                    updatedAt: '2022-02-03T14:38:40.557Z'
                    createdBy: john.doe@payrails.com
                failedWorkspaces:
                  - name: America Workspace
                    errorMessage: Failed to create workspace.
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      description: Error struct that includes the error, cause, reason, and possible resolutions. Check the full documentation [here](https://docs.payrails.com/docs/error-codes#error-structure).
