openapi: 3.1.0
info:
  version: 1.3.15
  title: Payrails API Reference
  contact:
    name: Payrails
    url: https://www.payrails.com
    email: tech@payrails.com
  license:
    name: Payrails GmbH
    url: https://www.payrails.com/
  description: |
    ---
    Payrails provides a collection of APIs that enable you to process and manage payments. Our APIs accept and return JSON in the HTTP body, and return standard HTTP response codes. You can consume the APIs directly using your favorite HTTP/REST library.
servers:
  - url: https://api.staging.payrails.io
    description: Payrails environment.
security:
  - ApiKey: []
tags:
  - name: ReconciliationRecords
    description: Operations to retrieve reconciliation record aggregates, transactions, and reconciliation metadata.
paths:
  /reconciliation/records/reconcile:
    post:
      summary: Bulk manually reconcile records
      operationId: bulkManualReconcileRecords
      description: |
        Marks multiple reconciliation records as manually reconciled in a single bulk operation, capturing operator supplied reasons and comments. Records must not already be in a reconciled resolution. The response includes a summary of successes and failures.
      security:
        - BearerToken:
            - reconciliationrecords:reconcile
      tags:
        - ReconciliationRecords
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                Payload used to bulk manually reconcile multiple records. Both `tagSlugs`
                and `reasons` are optional — manual reconciliation can run without any
                tags. When both are supplied, `tagSlugs` is the source of truth and
                `reasons` is ignored. The same tag set applies to every record in the batch.
              required:
                - id
              properties:
                id:
                  type: array
                  description: |
                    List of record identifiers to reconcile.
                  minItems: 1
                  items:
                    type: string
                    format: uuid
                tagSlugs:
                  type: array
                  description: |
                    Slugs of merchant-catalog tags to attach to every record in the batch as part of the reconcile action. Validated against the merchant tag catalog once before any DB write.
                  items:
                    type: string
                reasons:
                  type: array
                  deprecated: true
                  description: |
                    Deprecated. Use `tagSlugs` instead. Existing values continue to work and are coerced into the tag slug list when `tagSlugs` is empty; they will also be persisted on the published `manual-reconciliation-action` analytics event so downstream dashboards keep working. This field may be removed in a future major release.
                  items:
                    type: string
                    description: Operator-provided reason for manual reconciliation action.
                    enum:
                      - FEE_ADJUSTMENT
                      - FX_ADJUSTMENT
                      - RECONCILES_WITH_OTHER_TRANSACTIONS
                      - WITHIN_TOLERANCE
                      - SEPARATE_REFUND_OR_VOUCHER_ISSUED
                      - DUPLICATE_RECORD
                      - DATA_ERROR
                      - OTHER
                comments:
                  type: string
                  nullable: true
                  description: Optional operator comments associated with the manual reconciliation.
      responses:
        '200':
          description: Bulk reconciliation completed. See response for individual record outcomes.
          content:
            application/json:
              schema:
                type: object
                description: Response containing the outcome of a bulk manual reconciliation operation.
                required:
                  - success
                  - total
                  - failed
                  - result
                properties:
                  success:
                    type: integer
                    description: Number of records that were successfully reconciled.
                  total:
                    type: integer
                    description: Total number of records processed.
                  failed:
                    type: integer
                    description: Number of records that failed to reconcile.
                  result:
                    type: array
                    description: Individual outcome for each record in the request.
                    items:
                      type: object
                      description: Outcome of a bulk action on a single reconciliation record.
                      required:
                        - id
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Identifier of the record.
                        currentResolution:
                          allOf:
                            - type: string
                              description: Resolution state decided by reconciliation.
                              enum:
                                - RECONCILED
                                - UNRECONCILED
                            - description: The resolution state of the record after the operation.
                        currentStatus:
                          allOf:
                            - type: string
                              description: Lifecycle status derived from reconciliation result.
                              enum:
                                - OPEN
                                - FOREIGN
                                - DISCREPANCY
                                - MATCHED
                                - MANUALLY_RECONCILED
                                - MANUALLY_MATCHED
                                - MISSING_FROM_PSP
                                - MISSING_FROM_ACQUIRER
                                - MISSING_FROM_MERCHANT
                            - description: The status of the record after the operation.
                        error:
                          type: string
                          description: Error message if the reconciliation of this record failed. Only present when the record failed to reconcile.
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      description: Error struct that includes the error, cause, reason, and possible resolutions. Check the full documentation [here](https://docs.payrails.com/docs/error-codes#error-structure).
                      required:
                        - id
                        - code
                        - detail
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Unique identifier of the error. Please use this value when reporting an issue to our team, so we can help you faster.
                        code:
                          type: string
                          description: Machine-friendly error code assigned to the error. Check the full list of possible values [here](https://docs.payrails.com/docs/error-codes#list-of-error-codes).
                        detail:
                          type: string
                          description: Human-readable description about the error, its cause, and resolution.
                        docUrl:
                          type: string
                          description: Link to the specific documentation about this particular `code`.
                        reason:
                          type: object
                          additionalProperties: true
                          description: Metadata providing more details about the reason of the error. The structure of this object varies according to the `code`.
              example:
                errors:
                  - id: a24bc325-3929-4d9d-9c08-b3aa532685b7
                    code: request.malformed
                    detail: The request has malformed syntax
                    docUrl: https://docs.payrails.com/docs/error-codes#requestmalformed
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
