openapi: 3.1.0
info:
  version: 1.3.15
  title: Payrails API Reference
  contact:
    name: Payrails
    url: https://www.payrails.com
    email: tech@payrails.com
  license:
    name: Payrails GmbH
    url: https://www.payrails.com/
  description: |
    ---
    Payrails provides a collection of APIs that enable you to process and manage payments. Our APIs accept and return JSON in the HTTP body, and return standard HTTP response codes. You can consume the APIs directly using your favorite HTTP/REST library.
servers:
  - url: https://api.staging.payrails.io
    description: Payrails environment.
security:
  - ApiKey: []
tags:
  - name: Providers
    description: Operations related to managing Providers.
paths:
  /payment/providers:
    get:
      summary: Search & list providers
      operationId: listProviders
      description: Fetch a list of providers.
      tags:
        - Providers
      security:
        - BearerToken:
            - providers:list
            - providers:list:active
      parameters:
        - name: filter[status]
          in: query
          description: Filter by status.
          schema:
            type: string
            description: Status of the provider.
            enum:
              - active
              - inactive
        - name: filter[type]
          in: query
          description: Filter by type.
          schema:
            type: string
            description: Provider type.
            enum:
              - Fraud
              - Payment
              - Payout
              - Vault
              - NetworkOffers
              - ThreeDS
              - NetworkGateway
              - NetworkToken
              - Bin
              - Data
              - Dispute
              - DisputeAlert
              - Tax
        - name: filter[name]
          in: query
          schema:
            type: string
          description: Filter for a list of providers by name.
        - name: filter[displayName]
          in: query
          schema:
            type: string
          description: Filter for a list of providers by display name.
        - name: filter[createdAt]
          in: query
          description: |
            Filter by `createdAt` field using interval notation.

            `1973-02-03T04:32:11.596Z` - exact date value

            `(1973-02-03T04:32:11.596Z` - after the date excluding it

            `[1973-02-03T04:32:11.596Z` - after the date including it

            `1973-02-03T04:32:11.596Z)` - before the date excluding it

            `1973-02-03T04:32:11.596Z]` - before the date including it

            `(1973-02-03T04:32:11.596Z,1973-04-03T03:20:11.436Z)` - between two dates excluding both

            `(1973-02-03T04:32:11.596Z,1973-04-03T03:20:11.436Z]` - between two dates excluding on the left

            `[1973-02-03T04:32:11.596Z,1973-04-03T03:20:11.436Z)` - between two dates excluding on the right

            `[1973-02-03T04:32:11.596Z,1973-04-03T03:20:11.436Z]` - between two dates including both.
          schema:
            type: string
            example: '[2026-04-01T00:00:00Z,2026-05-01T00:00:00Z)'
        - name: filter[updatedAt]
          in: query
          description: Filter by updatedAt.
          schema:
            type: string
            example: '1978-01-04T19:33:19.261Z'
            description: |
              Filter by `updatedAt` field. The value should represent a range one of the following formats
              `(1973-02-03T04:32:11.596Z` - after the date excluding it

              `[1973-02-03T04:32:11.596Z` - after the date including it

              `1973-02-03T04:32:11.596Z)` - before the date excluding it

              `1973-02-03T04:32:11.596Z]` - before the date including it

              `(1973-02-03T04:32:11.596Z,1973-04-03T03:20:11.436Z)` - between two dates excluding both

              `(1973-02-03T04:32:11.596Z,1973-04-03T03:20:11.436Z]` - between two dates excluding on the left

              `[1973-02-03T04:32:11.596Z,1973-04-03T03:20:11.436Z)` - between two dates excluding on the right

              `[1973-02-03T04:32:11.596Z,1973-04-03T03:20:11.436Z]` - between two dates including both.
        - name: page[cursor]
          in: query
          description: Search collection items from that cursor.
          required: false
          schema:
            type: string
            description: Cursor for paging results.
          example: 9wkueqcavq
        - name: page[after]
          in: query
          description: Search collection items after that cursor.
          required: false
          schema:
            type: string
            description: Cursor for paging results.
          example: xk2h55zsy5
        - name: page[before]
          in: query
          description: Search collection items before that cursor.
          required: false
          schema:
            type: string
            description: Cursor for paging results.
          example: 9wkueqcavq
        - name: page[size]
          in: query
          description: Length of the collection to search.
          required: false
          schema:
            type: integer
            format: int32
          example: 20
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - results
                properties:
                  links:
                    required:
                      - self
                    properties:
                      self:
                        type: string
                      prev:
                        type: string
                      next:
                        type: string
                      first:
                        type: string
                      last:
                        type: string
                  results:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - name
                        - displayName
                        - type
                        - createdAt
                        - configSchema
                      properties:
                        id:
                          type: string
                          description: Unique identifier of the provider.
                          format: uuid
                        name:
                          type: string
                          description: Name of the provider.
                        displayName:
                          type: string
                          description: Display name of the provider.
                        type:
                          type: string
                          description: Provider type.
                          enum:
                            - Fraud
                            - Payment
                            - Payout
                            - Vault
                            - NetworkOffers
                            - ThreeDS
                            - NetworkGateway
                            - NetworkToken
                            - Bin
                            - Data
                            - Dispute
                            - DisputeAlert
                            - Tax
                        status:
                          type: string
                          description: Status of the provider.
                          enum:
                            - active
                            - inactive
                        configSchema:
                          type: string
                          description: JSON schema of the provider configuration.
                        selfOnboarding:
                          type: object
                          description: Self-onboarding capabilities available for this provider.
                          properties:
                            enabled:
                              type: boolean
                              description: Whether self-onboarding is enabled for this provider.
                            supportedAuthModes:
                              type: array
                              description: Authentication modes supported for self-onboarding.
                              items:
                                type: string
                                enum:
                                  - none
                                  - oauth
                        notificationURLTemplate:
                          type: string
                          description: |
                            Template of the notification URL for provider configs of that provider.
                            The template contains variables between curly braces that can be mapped to the fields of the provider configs (e.g. `{id}`, `{accountName}`)
                            and substituted to generate the notification URL of that provider config.
                        createdAt:
                          type: string
                          format: date-time
                          description: Date of creation of the provider.
                        updatedAt:
                          type: string
                          format: date-time
                          description: Last update of the provider.
              example:
                links:
                  self: https://api.staging.payrails.io/payment/providers?page[cursor]=MQ==&page[size]=20
                  prev: https://api.staging.payrails.io/payment/providers?page[before]=MA==&page[size]=20
                  next: https://api.staging.payrails.io/payment/providers?page[after]=Mg==&page[size]=20
                  first: https://api.staging.payrails.io/payment/providers?page[size]=20
                  last: https://api.staging.payrails.io/payment/providers?page[before]=Ng==&page[size]=20
                results:
                  - id: 5eb08624-ecce-4cbc-9a8a-61d484172815
                    name: adyen
                    displayName: Adyen
                    type: Payment
                    status: active
                    configSchema: '{"required":["accountDetails","credentials"],"definitions":{"PspAdyenAccountDetails":{"required":["merchantAccount"],"properties":{"merchantAccount":{"title":"Merchant account","minLength":1,"type":"string"},"prefix":{"title":"Prefix","description":"Account prefix used in URLs (only for Live accounts)","minLength":1,"type":"string"}},"type":"object"},"PspAdyenCredentials":{"required":["apiKey"],"properties":{"apiKey":{"title":"API key","description":"API key used to authenticate requests to the Adyen API","minLength":1,"type":"string","format":"secret"},"hmacKeys":{"title":"HMAC keys","description":"HMAC keys used to authenticate notifications from the Adyen API","pattern":"^[0-9A-F]{64}$","items":{"type":"string"},"type":"array"}},"type":"object"}},"properties":{"accountDetails":{"$ref":"#/definitions/PspAdyenAccountDetails","title":"Account details"},"credentials":{"$ref":"#/definitions/PspAdyenCredentials","title":"Checkout credentials"}},"type":"object"}'
                    createdAt: '2021-01-05T10:20:00.000Z'
                    updatedAt: '2021-01-05T10:20:00.000Z'
                  - id: 1f3cb3c4-3d8d-4f3c-94ad-30a0a17fde6d
                    name: checkout
                    displayName: Checkout.com
                    type: Payment
                    status: inactive
                    configSchema: '{"required":["accountDetails","credentials"],"definitions":{"PspCheckoutAccountDetails":{"required":["processingChannelId"],"properties":{"processingChannelId":{"title":"Processing channel ID","minLength":1,"pattern":"^pc_.+$","type":"string"}},"type":"object"},"PspCheckoutCredentials":{"required":["clientId","clientSecret"],"properties":{"clientId":{"title":"Client ID","description":"Client ID used to authenticate requests to the Checkout API","minLength":1,"type":"string"},"clientSecret":{"title":"Client Secret","description":"Client Secret used to authenticate requests to the Checkout API","minLength":1,"type":"string","format":"secret"},"hmacKeys":{"title":"HMAC keys","description":"HMAC keys used to authenticate notifications from the Checkout API","pattern":"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$","items":{"type":"string"},"type":"array","format":"secret"}},"type":"object"}},"properties":{"accountDetails":{"$ref":"#/definitions/PspCheckoutAccountDetails","title":"Account details"},"credentials":{"$ref":"#/definitions/PspCheckoutCredentials","title":"Checkout credentials"}},"type":"object"}'
                    createdAt: '2021-01-05T10:20:00.000Z'
                    updatedAt: '2021-01-05T10:20:00.000Z'
