openapi: 3.1.0
info:
  version: 1.3.15
  title: Payrails API Reference
  contact:
    name: Payrails
    url: https://www.payrails.com
    email: tech@payrails.com
  license:
    name: Payrails GmbH
    url: https://www.payrails.com/
  description: |
    ---
    Payrails provides a collection of APIs that enable you to process and manage payments. Our APIs accept and return JSON in the HTTP body, and return standard HTTP response codes. You can consume the APIs directly using your favorite HTTP/REST library.
servers:
  - url: https://api.staging.payrails.io
    description: Payrails environment.
security:
  - ApiKey: []
tags:
  - name: Rulesets
    description: Operations related to managing Rulesets.
paths:
  /merchant/rulesets:
    post:
      summary: Create a new Ruleset
      operationId: createRuleset
      description: Create a new merchant Ruleset.
      tags:
        - Rulesets
      security:
        - BearerToken:
            - rulesets:create
      parameters:
        - name: x-idempotency-key
          in: header
          description: |
            Idempotency key to be used.
            Sending again the same key would return the same result without re-executing the update.
          required: true
          schema:
            type: string
            format: uuid
          example: 91874e4d-81e9-4486-aee4-ee1de84da890
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rulesetConfig:
                  type: object
                  required:
                    - trigger
                    - defaultAction
                  properties:
                    trigger:
                      type: object
                      description: An action that determines when the rules should be evaluated.
                      required:
                        - 'on'
                      properties:
                        'on':
                          type: string
                          enum:
                            - determinePaymentOptions
                            - determineProviderOptions
                            - repeat
                          description: Action name.
                        filter:
                          description: A map of fields from the execution context and their expected values, which allows to trigger rules evaluation when all context field values match the expected ones.
                          anyOf:
                            - type: object
                              title: Action `determinePaymentOptions` filter.
                              description: Fields from execution context when payment options should be determined.
                              properties:
                                paymentMethodCode:
                                  type: string
                                  enum:
                                    - alexBankMa7fazty
                                    - amazonPay
                                    - applePay
                                    - audi2pay
                                    - alfa
                                    - alipay
                                    - bankTransfer
                                    - card
                                    - 2c2p
                                    - capitecPay
                                    - cibSmartWallet
                                    - easypaisa
                                    - etisalatCash
                                    - fawryMobileWallet
                                    - fawryPay
                                    - googlePay
                                    - jazzCash
                                    - mercadoPago
                                    - monoDirectDebit
                                    - nbePhoneCash
                                    - orangeCash
                                    - oPayWallet
                                    - pagaWallet
                                    - payflex
                                    - payjustnow
                                    - payPal
                                    - pix
                                    - konnect
                                    - qnbEWallet
                                    - wafaCashWallet
                                    - weCash
                                    - genericRedirect
                                    - eftPro
                                    - upi
                                    - cashFreeWallet
                                    - paytmMWallet
                                    - netBanking
                                    - meezaWallet
                                    - vodafoneCash
                                    - alipayQRCode
                                    - sepaDirectDebit
                                    - dcb
                                    - bankAccount
                                    - modo
                                    - ach
                                    - payzoneCash
                                    - revolutPay
                                    - lean
                                    - tabby
                                    - boleto
                                    - oxxo
                                    - spei
                                    - promptPay
                                    - qris
                                    - momoVN
                                    - vietQR
                                    - konbini
                                    - touchNGo
                                    - gCash
                                    - maya
                                    - pse
                                    - pagoEfectivo
                                    - napas
                                    - duitNowQR
                                    - grabPay
                                    - shopeePay
                                    - nequi
                                    - picPay
                                    - ovo
                                    - trueMoney
                                  description: Code of the payment method selected to perform the payment.
                            - type: object
                              title: Action `determineProviderOptions` filter.
                              description: Fields from execution context when provider options should be determined.
                              properties:
                                workflowNode:
                                  type: string
                                  enum:
                                    - authorize
                                    - startPaymentSession
                                  description: Workflow node.
                                providerConfigId:
                                  type: string
                                  format: uuid
                                  description: Unique identifier of the provider config.
                            - type: object
                              title: Action `repeat` filter.
                              description: Fields from execution context when repeat should be determined.
                              properties:
                                workflowNode:
                                  type: string
                                  enum:
                                    - authorize
                                  description: Workflow node.
                    rules:
                      type: array
                      description: Rules what need to be evaluated to execute or an action defined by a rule, which condition is fulfilled, or default action if none of conditions are fulfilled.
                      items:
                        type: object
                        title: Rule.
                        required:
                          - condition
                          - action
                        properties:
                          condition:
                            type: object
                            oneOf:
                              - type: object
                                title: Empty condition.
                                description: A condition that checks whether a field is empty.
                                required:
                                  - field
                                  - empty
                                properties:
                                  field:
                                    type: string
                                    description: An execution context field name.
                                  empty:
                                    type: boolean
                                    description: Whether the field must be empty (`true`) or not empty (`false`).
                              - type: object
                                title: Simple condition.
                                description: A simple condition.
                                required:
                                  - field
                                  - operator
                                oneOf:
                                  - required:
                                      - value
                                  - required:
                                      - referenceField
                                properties:
                                  field:
                                    type: string
                                    description: An execution context field name.
                                  operator:
                                    type: string
                                    description: An operator.
                                    enum:
                                      - '='
                                      - '>'
                                      - '>='
                                      - <
                                      - <=
                                      - IN
                                      - IS ONE OF
                                      - CONTAINS
                                      - STARTS WITH
                                      - ENDS WITH
                                  value:
                                    description: An expected value of the execution context field.
                                    oneOf:
                                      - type: string
                                        description: String value.
                                      - type: number
                                        description: Number value.
                                      - type: boolean
                                        description: Boolean value.
                                      - type: array
                                        description: List of values.
                                        items:
                                          oneOf:
                                            - type: string
                                            - type: number
                                  referenceField:
                                    type: string
                                    description: Another execution context field name to compare with `field`.
                              - type: object
                                title: Combination of conditions.
                                description: A combination of other condition types.
                                required:
                                  - left
                                  - operator
                                  - right
                                properties:
                                  left:
                                    type: object
                                    description: A condition, format of which is the same as `condition` field.
                                  operator:
                                    type: string
                                    description: A logical operator to combine 2 conditions.
                                    enum:
                                      - AND
                                      - OR
                                  right:
                                    type: object
                                    description: A condition, format of which is the same as `condition` field.
                              - type: object
                                title: Condition negation.
                                description: A combination of a condition with NOT operator.
                                required:
                                  - operator
                                  - right
                                properties:
                                  operator:
                                    type: string
                                    description: A logical operator to negate a condition.
                                    enum:
                                      - NOT
                                  condition:
                                    type: object
                                    description: A condition, format of which is the same as `condition` field.
                            description: Condition to be fulfilled to execute the action.
                          action:
                            type: object
                            oneOf:
                              - type: object
                                title: Set capture mode.
                                required:
                                  - type
                                  - params
                                properties:
                                  type:
                                    type: string
                                    description: Set the capture mode.
                                    enum:
                                      - setCaptureMode
                                  params:
                                    type: object
                                    required:
                                      - mode
                                    properties:
                                      mode:
                                        type: string
                                        description: Capture mode to define if money is captured instantly, with delay or manually.
                                        enum:
                                          - Instant
                                          - Delayed
                                          - Manual
                              - type: object
                                title: Set cancel mode.
                                required:
                                  - type
                                  - params
                                properties:
                                  type:
                                    type: string
                                    description: Set the cancel mode.
                                    enum:
                                      - setCancelMode
                                  params:
                                    type: object
                                    required:
                                      - mode
                                    properties:
                                      mode:
                                        type: string
                                        description: Cancel mode to define if authorization is canceled manually or with delay.
                                        enum:
                                          - Delayed
                                          - Manual
                              - type: object
                                title: Set delay.
                                required:
                                  - type
                                  - params
                                properties:
                                  type:
                                    type: string
                                    description: Set delay for a target action (e.g. expiration, a capture in a 2 step authorization process, or a cancel).
                                    enum:
                                      - setDelay
                                  params:
                                    type: object
                                    properties:
                                      delay:
                                        type: string
                                        format: ISO 8601
                                        description: Delay.
                              - type: object
                                title: Set priority.
                                required:
                                  - type
                                  - params
                                properties:
                                  type:
                                    type: string
                                    description: Set a priority for a target element (e.g. for a payment method in the payment options).
                                    enum:
                                      - setPriority
                                  params:
                                    type: object
                                    required:
                                      - priority
                                    properties:
                                      priority:
                                        type: number
                                        description: Priority number. Lower number is higher priority.
                              - type: object
                                title: Skip.
                                required:
                                  - type
                                properties:
                                  type:
                                    type: string
                                    description: Skip action. When returned, the targeted element will be skipped (e.g. skipping a payment method in the payment options).
                                    enum:
                                      - skip
                              - type: object
                                title: Stop.
                                required:
                                  - type
                                properties:
                                  type:
                                    type: string
                                    description: Stop action. When returned, the targeted action will be stopped (e.g. action retry attempt).
                                    enum:
                                      - stop
                              - type: object
                                title: Set instrument future usage.
                                required:
                                  - type
                                  - params
                                properties:
                                  type:
                                    type: string
                                    description: Set the future usage.
                                    enum:
                                      - setFutureUsage
                                  params:
                                    type: object
                                    required:
                                      - futureUsage
                                    properties:
                                      futureUsage:
                                        type: string
                                        description: Future usage to define the payment flows that the stored instrument will be used for. For cards, it is necessary to optimize the authorization rates and comply with regional legislation (such as SCA in EU) and card network rules.
                                        enum:
                                          - Subscription
                                          - CardOnFile
                                          - UnscheduledCardOnFile
                              - type: object
                                title: Add Next Step.
                                required:
                                  - type
                                  - params
                                properties:
                                  type:
                                    type: string
                                    enum:
                                      - addNextStep
                                  params:
                                    type: object
                                    title: Add Next Step Parameters.
                                    description: Parameters for adding a next step to the workflow queue.
                                    required:
                                      - code
                                    properties:
                                      code:
                                        type: string
                                        description: Code of the next workflow step to execute.
                                      mapping:
                                        type: array
                                        description: Mapping allows to add a field to the next workflow step input from the previous step output or set static values.
                                        items:
                                          type: object
                                          title: Field Mapping.
                                          description: Maps a field from source to destination or sets a static value. Using both 'from' and 'value' in the same mapping is not allowed.
                                          required:
                                            - to
                                          properties:
                                            from:
                                              type: string
                                              description: Source field path in the trigger request (optional if using static value).
                                            to:
                                              type: string
                                              description: Destination field path in the next step input.
                                            value:
                                              description: Static value to set in the destination field instead of mapping from source.
                              - type: object
                                title: Add Workflow Execution Status.
                                required:
                                  - type
                                  - params
                                properties:
                                  type:
                                    type: string
                                    enum:
                                      - addWorkflowExecutionStatus
                                  params:
                                    type: object
                                    title: Add Workflow Execution Status Parameters
                                    description: Parameters for adding a workflow execution status.
                                    required:
                                      - status
                                    properties:
                                      status:
                                        type: string
                                        description: Workflow execution status to add.
                            description: Action to execute if the rule condition is fulfilled.
                    defaultAction:
                      type: object
                      oneOf:
                        - type: object
                          title: Set capture mode.
                          required:
                            - type
                            - params
                          properties:
                            type:
                              type: string
                              description: Set the capture mode.
                              enum:
                                - setCaptureMode
                            params:
                              type: object
                              required:
                                - mode
                              properties:
                                mode:
                                  type: string
                                  description: Capture mode to define if money is captured instantly, with delay or manually.
                                  enum:
                                    - Instant
                                    - Delayed
                                    - Manual
                        - type: object
                          title: Set cancel mode.
                          required:
                            - type
                            - params
                          properties:
                            type:
                              type: string
                              description: Set the cancel mode.
                              enum:
                                - setCancelMode
                            params:
                              type: object
                              required:
