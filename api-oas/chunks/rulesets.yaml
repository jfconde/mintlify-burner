                                      - cibSmartWallet
                                      - easypaisa
                                      - etisalatCash
                                      - fawryMobileWallet
                                      - fawryPay
                                      - googlePay
                                      - jazzCash
                                      - mercadoPago
                                      - monoDirectDebit
                                      - nbePhoneCash
                                      - orangeCash
                                      - oPayWallet
                                      - pagaWallet
                                      - payflex
                                      - payjustnow
                                      - payPal
                                      - pix
                                      - konnect
                                      - qnbEWallet
                                      - wafaCashWallet
                                      - weCash
                                      - genericRedirect
                                      - eftPro
                                      - upi
                                      - cashFreeWallet
                                      - paytmMWallet
                                      - netBanking
                                      - meezaWallet
