                              properties:
                                mode:
                                  type: string
                                  description: Cancel mode to define if authorization is canceled manually or with delay.
                                  enum:
                                    - Delayed
                                    - Manual
                        - type: object
                          title: Set delay.
                          required:
                            - type
                            - params
                          properties:
                            type:
                              type: string
                              description: Set delay for a target action (e.g. expiration, a capture in a 2 step authorization process, or a cancel).
                              enum:
                                - setDelay
                            params:
                              type: object
                              properties:
                                delay:
                                  type: string
                                  format: ISO 8601
                                  description: Delay.
                        - type: object
                          title: Set priority.
                          required:
                            - type
                            - params
                          properties:
                            type:
                              type: string
                              description: Set a priority for a target element (e.g. for a payment method in the payment options).
                              enum:
                                - setPriority
                            params:
                              type: object
                              required:
                                - priority
                              properties:
                                priority:
                                  type: number
                                  description: Priority number. Lower number is higher priority.
                        - type: object
                          title: Skip.
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              description: Skip action. When returned, the targeted element will be skipped (e.g. skipping a payment method in the payment options).
                              enum:
                                - skip
                        - type: object
                          title: Stop.
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              description: Stop action. When returned, the targeted action will be stopped (e.g. action retry attempt).
                              enum:
                                - stop
                        - type: object
                          title: Set instrument future usage.
                          required:
                            - type
                            - params
                          properties:
                            type:
                              type: string
                              description: Set the future usage.
                              enum:
                                - setFutureUsage
                            params:
                              type: object
                              required:
                                - futureUsage
                              properties:
                                futureUsage:
                                  type: string
                                  description: Future usage to define the payment flows that the stored instrument will be used for. For cards, it is necessary to optimize the authorization rates and comply with regional legislation (such as SCA in EU) and card network rules.
                                  enum:
                                    - Subscription
                                    - CardOnFile
                                    - UnscheduledCardOnFile
                        - type: object
                          title: Add Next Step.
                          required:
                            - type
                            - params
                          properties:
                            type:
                              type: string
                              enum:
                                - addNextStep
                            params:
                              type: object
                              title: Add Next Step Parameters.
                              description: Parameters for adding a next step to the workflow queue.
                              required:
                                - code
                              properties:
                                code:
                                  type: string
                                  description: Code of the next workflow step to execute.
                                mapping:
                                  type: array
                                  description: Mapping allows to add a field to the next workflow step input from the previous step output or set static values.
                                  items:
                                    type: object
                                    title: Field Mapping.
                                    description: Maps a field from source to destination or sets a static value. Using both 'from' and 'value' in the same mapping is not allowed.
                                    required:
                                      - to
                                    properties:
                                      from:
                                        type: string
                                        description: Source field path in the trigger request (optional if using static value).
                                      to:
                                        type: string
                                        description: Destination field path in the next step input.
                                      value:
                                        description: Static value to set in the destination field instead of mapping from source.
                        - type: object
                          title: Add Workflow Execution Status.
                          required:
                            - type
                            - params
                          properties:
                            type:
                              type: string
                              enum:
                                - addWorkflowExecutionStatus
                            params:
                              type: object
                              title: Add Workflow Execution Status Parameters
                              description: Parameters for adding a workflow execution status.
                              required:
                                - status
                              properties:
                                status:
                                  type: string
                                  description: Workflow execution status to add.
                      description: Default action to execute if none of rule conditions are fulfilled.
                workspaceId:
                  type: string
                  format: uuid
                  description: Workspace ID that the ruleset belongs to.
            examples:
              determinePaymentOptions:
                description: determinePaymentOptions
                value:
                  rulesetConfig:
                    trigger:
                      'on': determinePaymentOptions
                      filter:
                        workflowCode: payment-acceptance
                        workflowVersion: 3
                        paymentMethod: card
                    rules:
                      - condition:
                          left:
                            field: customer.country.code
                            operator: IS ONE OF
                            value:
                              - AR
                              - CL
                          operator: AND
                          right:
                            field: clientContext.osType
                            operator: '='
                            value: ios
                        action:
                          type: setPriority
                          params:
                            priority: 1
                    defaultAction:
                      type: skip
                  workspaceId: 7f9f1882-a103-408d-ac96-46a7021e537a
              determineProviderOptionsRule:
                description: determineProviderOptions with rule
                value:
                  rulesetConfig:
                    trigger:
                      'on': determineProviderOptions
                      filter:
                        providerConfigID: 5eb08624-ecce-4cbc-9a8a-61d484172815
                    rules:
                      - condition:
                          field: customer.country.code
                          operator: '='
                          value: DE
                        action:
                          type: setPriority
                          params:
                            priority: 1
                    defaultAction:
                      type: skip
                  workspaceId: 7f9f1882-a103-408d-ac96-46a7021e537a
              determineProviderOptionsDefaultAction:
                description: determineProviderOptions with defaultAction
                value:
                  rulesetConfig:
                    trigger:
                      'on': determineProviderOptions
                      filter:
                        providerConfigID: 1f3cb3c4-3d8d-4f3c-94ad-30a0a17fde6d
                    defaultAction:
                      type: setPriority
                      params:
                        priority: 1
                  workspaceId: 7f9f1882-a103-408d-ac96-46a7021e537a
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                title: Ruleset.
                required:
                  - id
                  - version
                  - workspaceId
                allOf:
                  - type: object
                    properties:
                      createdAt:
                        type: string
                        format: date-time
                        description: Creation date of the ruleset.
                  - type: object
                    required:
                      - id
                      - version
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: ID of Ruleset.
                      version:
                        type: number
                        description: Ruleset version.
                  - type: object
                    required:
                      - trigger
                      - defaultAction
                    properties:
