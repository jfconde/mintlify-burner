  /payment/frauds/{fraudId}:
    get:
      summary: Get Fraud check by ID
      operationId: getFraud
      description: Find a Fraud check from a given ID.
      tags:
        - FraudChecks
      security:
        - BearerToken:
            - frauds:read
      parameters:
        - name: fraudId
          in: path
          description: Identifier of the resource in Payrails.
          required: true
          schema:
            type: string
            format: uuid
          example: d5454c2f-ae5e-44f3-8edf-f6dad64f005f
        - name: includeInstrument
          in: query
          schema:
            type: boolean
            default: false
          description: Boolean indicating if the payment instrument should be included in the response.
        - name: includeHolderReference
          in: query
          schema:
            type: boolean
            default: false
          description: Boolean indicating if the holder reference should be included in the response.
      responses:
        '200':
          description: Fraud check found, and all details are included.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - createdAt
                  - updatedAt
                  - status
                  - workflowExecutionId
                  - providerId
                  - providerConfigId
                  - meta
                  - workspaceId
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Unique identifier of the Fraud check in Payrails.
                  createdAt:
                    format: date-time
                    description: Exact date and time when the Fraud check was created in Payrails. Possibly differs slightly from the date in the fraud provider.
                    type: string
                  updatedAt:
                    format: date-time
                    description: Exact date and time when the Fraud check was last updated in Payrails. Possibly differs slightly from the date in the fraud provider.
                    type: string
                  status:
                    type: string
                    description: Current status of the Fraud check in Payrails. More information can be found [here](/docs/fraud-status).
                    enum:
                      - Created
                      - ReviewRequired
                      - Scored
                      - Pending
                      - Failed
                      - Unknown
                  merchantReference:
                    type: string
                    description: Merchant-provided reference for the Execution. Commonly, the identifier of the order on the Merchant's system.
                    example: order_15415
                  holderReference:
                    type: string
                    description: Merchant-provided reference for the transaction counterparty, i.e. the paying consumer.
                  holderId:
                    type: string
                    format: uuid
                    description: Unique identifier of the Holder in Payrails.
                  decision:
                    type: string
                    description: Decision taken by the fraud provider.
                    enum:
                      - Allow
                      - Review
                      - Prevent
                      - Challenge
                      - NoDecision
                      - Ignore
                  workflowExecutionId:
                    type: string
                    description: Merchant-specific identifier of the execution. This can be used for searching for the Fraud check later.
                  workflowExecutionActionId:
                    type: string
                    format: uuid
                    description: Identifier of the action in the Workflow that led to this Fraud check.
                  providerId:
                    type: string
                    format: uuid
                    description: Unique identifier of the Provider that was used to process the Fraud check.
                  providerConfigId:
                    type: string
                    format: uuid
                    description: Unique identifier of the merchant-specific Provider Configuration that was used to process the Fraud check. This can include the set of credentials used, the merchant account, etc.
                  providerName:
                    type: string
                    description: Name of the Provider that was used to process the Fraud check, e.g. Adyen, Checkout, Stripe.
                  providerDisplayName:
                    type: string
                    description: Display name of the Provider that was used to process the Fraud check.
                  providerReference:
                    type: string
                    description: Unique identifier of the Fraud check in an external system, e.g. Fraud provider.
                  providerAccountDisplayName:
                    type: string
                    description: Display name of the Provider Account/Configuration that was used to process the Fraud check.
                  instrumentId:
                    type: string
                    format: uuid
                    description: Unique identifier of the Instrument that was used for the Payment in Payrails.
                  instrumentTokenId:
                    type: string
                    format: uuid
                    description: Unique identifier of the specific Token inside the Instrument used for the Payment in Payrails.
                  instrument:
                    type: object
                    required:
                      - id
                      - holderId
                      - paymentMethod
                      - status
                      - createdAt
                      - updatedAt
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Id of the instrument.
                      createdAt:
                        type: string
                        format: date-time
                        description: Date and time when the Instrument was created in Payrails.
                      updatedAt:
                        type: string
                        format: date-time
                        description: When the Instrument was last updated.
                      holderId:
                        type: string
                        format: uuid
                        description: Unique identifier of the Holder in Payrails.
                      paymentMethod:
                        type: string
                        description: Represents the payment method type.
                        enum:
                          - alexBankMa7fazty
                          - applePay
                          - audi2pay
                          - bankAccount
                          - card
                          - 2c2p
                          - vietQR
                          - cibSmartWallet
                          - easypaisa
                          - etisalatCash
                          - fawryMobileWallet
                          - fawryPay
                          - googlePay
                          - jazzCash
                          - nbePhoneCash
                          - orangeCash
                          - payPal
                          - qnbEWallet
                          - weCash
                          - genericRedirect
                          - alfa
                          - konnect
                          - eftPro
                          - netBanking
                          - upi
                          - cashFreeWallet
                          - paytmWallet
                          - phonePe
                      status:
                        type: string
                        description: Status of the instrument.
                        enum:
                          - created
                          - deleted
                          - enabled
                          - disabled
                          - transient
                      displayName:
                        type: string
                        description: Instrument name suitable for display.
                      description:
                        type: string
                        description: Description of the instrument.
                      default:
                        type: boolean
                        description: True if this instrument is set as default for the holder.
                        nullable: true
                      merchantReference:
                        type: string
                        description: Merchant-provided reference for the instrument.
                      fingerprint:
                        type: string
                        description: System-wide unique identifier of the Instrument. If two Holders have the same instrument stored, this value will be the same for both, but the instrument and token IDs will be different. Cannot be used for payments, should only be used for analytics and fraud prevention.
                      futureUsage:
                        type: string
                        description: Represents the future usage to define the payment flows that the stored instrument will be used for.
                        enum:
                          - Subscription
                          - CardOnFile
                          - UnscheduledCardOnFile
                      networkTransactionReference:
                        type: string
                        description: Identifier of the initial payment made with this instrument on the Networks, e.g. Mastercard Trace ID or Visa Transaction ID.
                      data:
