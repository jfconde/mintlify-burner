openapi: 3.1.0
info:
  version: 1.3.15
  title: Payrails API Reference
  contact:
    name: Payrails
    url: https://www.payrails.com
    email: tech@payrails.com
  license:
    name: Payrails GmbH
    url: https://www.payrails.com/
  description: |
    ---
    Payrails provides a collection of APIs that enable you to process and manage payments. Our APIs accept and return JSON in the HTTP body, and return standard HTTP response codes. You can consume the APIs directly using your favorite HTTP/REST library.
servers:
  - url: https://api.staging.payrails.io
    description: Payrails environment.
security:
  - ApiKey: []
tags:
  - name: FraudChecks
    description: A Fraud check Payrails is a collection of operations over time, that is created by a workflow execution and followed by the workflow actions. In this section, you can list all the fraud entities or a single one to learn about the details of involved instruments, providers, statuses, decisions and more.
paths:
  /payment/frauds:
    get:
      summary: Search & list Fraud checks
      operationId: listFraudChecks
      description: Fetch a list of fraud checks.
      security:
        - BearerToken:
            - frauds:read
      tags:
        - FraudChecks
      parameters:
        - name: includeInstrument
          in: query
          schema:
            type: boolean
            default: false
          description: Boolean indicating if the payment instrument should be included in the response.
        - name: includeHolderReference
          in: query
          schema:
            type: boolean
            default: false
          description: Boolean indicating if the holder reference should be included in the response.
        - name: filter[fraudId]
          in: query
          schema:
            type: string
          description: Filter for a list of fraud checks by ID.
        - name: filter[providerId]
          in: query
          schema:
            type: string
          description: Filter for a list of fraud checks by provider ID.
        - name: filter[providerConfigId]
          in: query
          schema:
            type: string
          description: Filter for a list of fraud checks by provider config ID.
        - name: filter[providerReference]
          in: query
          schema:
            type: string
          description: Filter for a list of fraud checks by provider reference.
        - name: filter[holderId]
          in: query
          schema:
            type: string
          description: Filter for a list of fraud checks by holder ID.
        - name: filter[holderReference]
          in: query
          schema:
            type: string
          description: Filter for a list of fraud checks by holder reference.
        - name: filter[workflowExecutionId]
          in: query
          schema:
            type: string
          description: Filter for a list of fraud checks by workflow execution ID.
        - name: filter[status]
          in: query
          schema:
            type: string
          description: Filter for a list of fraud checks by latest payment status.
        - name: filter[decision]
          in: query
          schema:
            type: string
          description: Filter for a list of fraud checks by any decision.
        - name: filter[instrumentId]
          in: query
          schema:
            type: string
          description: Filter for a list of fraud checks by instrument ID.
        - name: filter[instrumentBin]
          in: query
          schema:
            type: string
          description: Filter for a list of fraud checks by instrument BIN.
        - name: filter[instrumentSuffix]
          in: query
          schema:
            type: string
          description: Filter for a list of fraud checks by instrument suffix.
        - name: filter[instrumentNetwork]
          in: query
          schema:
            type: string
          description: Filter for a list of fraud checks by card network.
        - name: filter[instrumentIssuer]
          in: query
          schema:
            type: string
          description: Filter for a list of fraud checks by instrument issuer.
        - name: filter[instrumentIssuerCountry]
          in: query
          schema:
            type: string
          description: Filter for a list of fraud checks by instrument issuer country.
        - name: filter[instrumentFutureUsage]
          in: query
          schema:
            type: string
          description: Filter for a list of fraud checks by instrument future usage.
        - name: filter[workspaceId]
          in: query
          description: Filter by Workspace ID.
          schema:
            type: string
        - name: filter[createdAt]
          in: query
          description: |
            Filter by `createdAt` field using interval notation.

            `1973-02-03T04:32:11.596Z` - exact date value

            `(1973-02-03T04:32:11.596Z` - after the date excluding it

            `[1973-02-03T04:32:11.596Z` - after the date including it

            `1973-02-03T04:32:11.596Z)` - before the date excluding it

            `1973-02-03T04:32:11.596Z]` - before the date including it

            `(1973-02-03T04:32:11.596Z,1973-04-03T03:20:11.436Z)` - between two dates excluding both

            `(1973-02-03T04:32:11.596Z,1973-04-03T03:20:11.436Z]` - between two dates excluding on the left

            `[1973-02-03T04:32:11.596Z,1973-04-03T03:20:11.436Z)` - between two dates excluding on the right

            `[1973-02-03T04:32:11.596Z,1973-04-03T03:20:11.436Z]` - between two dates including both.
          schema:
            type: string
            example: '[2026-04-01T00:00:00Z,2026-05-01T00:00:00Z)'
        - name: page[cursor]
          in: query
          description: Search collection items from that cursor.
          required: false
          schema:
            type: string
            description: Cursor for paging results.
          example: 9wkueqcavq
        - name: page[after]
          in: query
          description: Search collection items after that cursor.
          required: false
          schema:
            type: string
            description: Cursor for paging results.
          example: xk2h55zsy5
        - name: page[before]
          in: query
          description: Search collection items before that cursor.
          required: false
          schema:
            type: string
            description: Cursor for paging results.
          example: 9wkueqcavq
        - name: page[size]
          in: query
          description: Length of the collection to search.
          required: false
          schema:
            type: integer
            format: int32
          example: 20
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - links
                  - results
                properties:
                  links:
                    required:
                      - self
                    properties:
                      self:
                        type: string
                      prev:
                        type: string
                      next:
                        type: string
                      first:
                        type: string
                      last:
                        type: string
                  results:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - createdAt
                        - updatedAt
                        - status
                        - workflowExecutionId
                        - providerId
                        - providerConfigId
                        - meta
                        - workspaceId
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Unique identifier of the Fraud check in Payrails.
                        createdAt:
                          format: date-time
                          description: Exact date and time when the Fraud check was created in Payrails. Possibly differs slightly from the date in the fraud provider.
                          type: string
                        updatedAt:
                          format: date-time
                          description: Exact date and time when the Fraud check was last updated in Payrails. Possibly differs slightly from the date in the fraud provider.
                          type: string
                        status:
                          type: string
                          description: Current status of the Fraud check in Payrails. More information can be found [here](/docs/fraud-status).
                          enum:
                            - Created
                            - ReviewRequired
                            - Scored
                            - Pending
                            - Failed
                            - Unknown
                        merchantReference:
                          type: string
                          description: Merchant-provided reference for the Execution. Commonly, the identifier of the order on the Merchant's system.
                          example: order_15415
                        holderReference:
                          type: string
                          description: Merchant-provided reference for the transaction counterparty, i.e. the paying consumer.
                        holderId:
                          type: string
                          format: uuid
                          description: Unique identifier of the Holder in Payrails.
                        decision:
                          type: string
                          description: Decision taken by the fraud provider.
                          enum:
                            - Allow
                            - Review
                            - Prevent
                            - Challenge
                            - NoDecision
                            - Ignore
                        workflowExecutionId:
                          type: string
                          description: Merchant-specific identifier of the execution. This can be used for searching for the Fraud check later.
                        workflowExecutionActionId:
                          type: string
                          format: uuid
                          description: Identifier of the action in the Workflow that led to this Fraud check.
                        providerId:
                          type: string
                          format: uuid
                          description: Unique identifier of the Provider that was used to process the Fraud check.
                        providerConfigId:
                          type: string
                          format: uuid
                          description: Unique identifier of the merchant-specific Provider Configuration that was used to process the Fraud check. This can include the set of credentials used, the merchant account, etc.
                        providerName:
                          type: string
                          description: Name of the Provider that was used to process the Fraud check, e.g. Adyen, Checkout, Stripe.
                        providerDisplayName:
                          type: string
                          description: Display name of the Provider that was used to process the Fraud check.
                        providerReference:
                          type: string
                          description: Unique identifier of the Fraud check in an external system, e.g. Fraud provider.
                        providerAccountDisplayName:
                          type: string
                          description: Display name of the Provider Account/Configuration that was used to process the Fraud check.
                        instrumentId:
                          type: string
                          format: uuid
                          description: Unique identifier of the Instrument that was used for the Payment in Payrails.
                        instrumentTokenId:
                          type: string
                          format: uuid
                          description: Unique identifier of the specific Token inside the Instrument used for the Payment in Payrails.
