  /payment/frauds/{fraudId}/operations:
    get:
      summary: Get Fraud Operations by Fraud ID
      operationId: getFraudOperations
      description: Find a fraud operation from a given `fraudID`.
      tags:
        - FraudChecks
      security:
        - BearerToken:
            - frauds:read
      parameters:
        - name: fraudId
          in: path
          description: Identifier of the resource in Payrails.
          required: true
          schema:
            type: string
            format: uuid
          example: d5454c2f-ae5e-44f3-8edf-f6dad64f005f
        - name: includeLatency
          in: query
          schema:
            type: boolean
          description: Include latency in the response.
        - name: includeLogs
          in: query
          schema:
            type: boolean
          description: Include operation logs in the response.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - createdAt
                        - updatedAt
                        - type
                        - result
                        - workspaceId
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Unique identifier of the Fraud Operation in Payrails.
                        fraudId:
                          type: string
                          format: uuid
                          description: Unique identifier of the Fraud check that this Operation belongs to in Payrails.
                        createdAt:
                          type: string
                          format: date-time
                          description: Exact date and time when the Fraud Operation was created in Payrails. Possibly differs slightly from the date in the fraud provider.
                        updatedAt:
                          type: string
                          format: date-time
                          description: Exact date and time when the Fraud Operation was updated in Payrails. Possibly differs slightly from the date in the fraud provider.
                        result:
                          type: string
                          description: Operation Result that was executed in the Provider.
                          enum:
                            - Success
                            - Unknown
                            - Timeout
                            - ProviderTimeout
                            - UnexpectedProviderResponse
                            - ProviderUnknownError
                            - ProviderConnectionError
                            - DuplicateOperation
                            - OperationNotAllowed
                            - ValidationError
                            - ParamsError
                            - ProviderConfigError
                            - InvalidSignature
                            - InternalServerError
                            - AuthenticationError
                        type:
                          type: string
                          description: Operation Type that was executed in the Provider.
                          enum:
                            - FraudScore
                            - FraudScoreNotification
                        providerReference:
                          type: string
                          description: Unique identifier of the Fraud Operation in an external system. Some PSPs provide a specific ID for each update in the Fraud, but most of them use the same as the original Fraud.
                        decision:
                          type: string
                          description: Decision taken by the fraud provider.
                          enum:
                            - Allow
                            - Review
                            - Prevent
                            - Challenge
                            - NoDecision
                            - Ignore
                        reason:
                          type: string
                          description: Reason why the operation was done.
                        errorDetails:
                          type: string
                          description: Error details from the Payrails or the provider in case of error.
                        providerExecutedAt:
                          type: string
                          format: date-time
                          description: Exact date and time when the Fraud Operation was executed in the fraud provider.
                        resultProviderDetails:
                          type: object
                          description: Specific details of the provider response that mapped to the specific Payrails result.
                          properties:
                            message:
                              type: string
                              description: Message from the provider response.
                            additionalData:
                              type: object
                              description: Additional data sent in the provider response.
                              additionalProperties:
                                type: string
                        actionId:
                          type: string
                          format: uuid
                          description: Identifier of the action in the Workflow that led to this Fraud check.
                        workspaceId:
                          type: string
                          format: uuid
                          description: Workspace ID that the workflow configuration belongs to.
                        operationLogs:
                          type: array
                          items:
                            type: object
                            description: Whenever there is an interaction with an external provider, Payrails records a Log to keep the exact information about what was sent and received.
                            required:
                              - id
                              - createdAt
                              - operationId
                              - input
                              - output
                            properties:
                              id:
                                type: string
                                format: uuid
                                description: Unique identifier of the Operation Log in Payrails.
                              createdAt:
                                type: string
                                format: date-time
                                description: Exact date and time when the Operation Log was created in Payrails. Possibly differs slightly from the date in the provider.
                              operationId:
                                type: string
                                format: uuid
                                description: Unique identifier of the Operation that this Log belongs to in Payrails.
                              input:
                                type: string
                                description: Original request object sent to the Provider.
                              output:
                                type: string
                                description: Original response object received from the Provider.
                              workspaceId:
                                type: string
                                format: uuid
                                description: Workspace ID that the workflow configuration belongs to.
                              providerLatency:
                                type: string
                                description: Latency of the operation on the provider side.
                              totalLatency:
                                type: string
                                description: Total latency of the operation.
                          description: List of operation logs associated with this operation.
                        providerLatency:
                          type: string
                          description: Latency of the operation on the provider side.
                        totalLatency:
                          type: string
                          description: Total latency of the operation.
