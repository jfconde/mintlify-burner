                                description: Unique name of custom function that will be executed part of this rule.
                                enum:
                                  - maskedCardInRequestHeaders
                status:
                  type: string
                  example: draft
            examples:
              inbound:
                description: Inbound connection version
                value:
                  name: Fetch reservations
                  description: get all reservations
                  publicUrl: /test-me
                  proxyUrl: https://test.com/path/123
                  httpMethods:
                    - POST
                    - PATCH
                  rules:
                    - action: tokenization
                      config:
                        targetRecordType: card
                        targetContentType: xml
                        expiresIn: 5000
                        fields:
                          cardNumber:
                            aliasFormat: uuid
                            displayFormat: last4
                            fieldSelector: /card/expiryMonth
                            storagePolicy: permanent
                          expiryMonth:
                            aliasFormat: uuid
                            displayFormat: null
                            fieldSelector: /card/expiryMonth
                            storagePolicy: permanent
                          expiryYear:
                            aliasFormat: uuid
                            fieldSelector: /card/expiryYear
                            storagePolicy: permanent
                          securityCode:
                            aliasFormat: uuid
                            fieldSelector: /card/cvv
                            storagePolicy: volatile
                          holderName:
                            aliasFormat: uuid
                            fieldSelector: /card/holderName
                            storagePolicy: permanent
                        recordSelector: /xxx/card
                      sequence: 1
                      target: requestBody
                    - action: tokenization
                      config:
                        targetContentType: xml
                        targetRecordType: networkToken
                        expiresIn: 5000
                        fields:
                          networkToken:
                            aliasFormat: uuid
                            displayFormat: last4
                            fieldSelector: /card/expiryMonth
                            storagePolicy: permanent
                          expiryMonth:
                            aliasFormat: uuid
                            fieldSelector: /card/expiryMonth
                            storagePolicy: permanent
                          expiryYear:
                            aliasFormat: uuid
                            fieldSelector: /card/expiryMonth
                            storagePolicy: permanent
                        recordSelector: /xxx/card
                      sequence: 2
                      target: requestBody
                    - action: customFunction
                      function:
                        identifier: maskedCardInRequestHeaders
                      sequence: 3
                      target: requestBody
                  status: draft
              outbound:
                description: outbound connection version
                value:
                  name: Fetch reservations
                  description: get all reservations
                  publicUrl: /test-me
                  httpMethods:
                    - POST
                    - PATCH
                  trustedDestinationHosts:
                    - test.com
                    - example.com
                  rules:
                    - action: detokenization
                      config:
                        targetRecordType: card
                        targetContentType: xml
                        expiresIn: 5000
                        fields:
                          cardNumber:
                            fieldSelector: /card/number
                          expiryMonth:
                            fieldSelector: /card/expiryMonth
                            fieldRegex: (.*)/.*
                          expiryYear:
                            fieldSelector: /card/expiryYear
                            fieldRegex: .*/(.*)
                          holderName:
                            fieldSelector: /card/name
                        recordSelector: /xxx/card
                      sequence: 1
                      target: requestBody
                    - action: detokenization
                      config:
                        targetRecordType: networkToken
                        targetContentType: xml
                        expiresIn: 5000
                        fields:
                          networkToken:
                            fieldSelector: /card/number
                          expiryMonth:
                            fieldSelector: /card/expiryMonth
                            fieldRegex: (.*)/.*
                          expiryYear:
                            fieldSelector: /card/expiryYear
