openapi: 3.1.0
info:
  version: 1.3.15
  title: Payrails API Reference
  contact:
    name: Payrails
    url: https://www.payrails.com
    email: tech@payrails.com
  license:
    name: Payrails GmbH
    url: https://www.payrails.com/
  description: |
    ---
    Payrails provides a collection of APIs that enable you to process and manage payments. Our APIs accept and return JSON in the HTTP body, and return standard HTTP response codes. You can consume the APIs directly using your favorite HTTP/REST library.
servers:
  - url: https://api.staging.payrails.io
    description: Payrails environment.
security:
  - ApiKey: []
tags:
  - name: Vault Proxy Connections
    description: Operations related to managing token connections.
paths:
  /token/connections:
    post:
      summary: Create a connection
      operationId: createVaultConnections
      description: |
        Saves the connection data and returns connection with ID.
      security:
        - BearerToken:
            - vaultconnections:create
      tags:
        - Vault Proxy Connections
      requestBody:
        description: The connection data that need to be saved.
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  properties:
                    name:
                      type: string
                      description: Name of the connection.
                    description:
                      type: string
                      description: |
                        Description of the connection.
                    connectionType:
                      type: string
                      description: |
                        Defines the category of the connection. Once a connection is created, this value is fixed and cannot be modified.
                        You can find more information about types of connections [in guide](https://docs.payrails.com/docs/proxy-connections).
                      enum:
                        - inbound
                        - outbound
                  required:
                    - name
                    - connectionType
              title: Details about connection.
      responses:
        '201':
          description: Details about connection.
          content:
            application/json:
              schema:
                title: Connection object
                allOf:
                  - type: object
                    properties:
                      name:
                        type: string
                        description: Name of the connection.
                      description:
                        type: string
                        description: |
                          Description of the connection.
                      connectionType:
                        type: string
                        description: |
                          Defines the category of the connection. Once a connection is created, this value is fixed and cannot be modified.
                          You can find more information about types of connections [in guide](https://docs.payrails.com/docs/proxy-connections).
                        enum:
                          - inbound
                          - outbound
                    required:
                      - name
                      - connectionType
                  - type: object
                    properties:
                      id:
                        type: string
                        description: Internal facing connection identifier.
                      liveVersionId:
                        type: string
                        description: |
                          Each connection has multiple versions (`connectionVersions`) that include configurations.
                          At any given time, only one version can be live for a connection.
                          This field specifically stores the version that is live for a particular connection. If `liveVersionId` is
                          set to `null` it means connection is not live.
                        nullable: true
                      workspaceId:
                        type: string
                        description: ID of the workspace to which the connection belongs.
                      updatedAt:
                        type: string
                        format: date-time
                        description: Date and time when the connection was last updated.
                        example: '2025-03-11T09:31:52.131176Z'
                      createdAt:
                        type: string
                        format: date-time
                        description: Date and time when the connection was created.
                        example: '2025-03-11T09:31:52.131176Z'
                      deletedAt:
                        type: string
                        format: date-time
                        nullable: true
                        description: Date and time when the connection was deleted. Null if the connection is not deleted.
                        example: '2025-03-11T09:31:52.131176Z'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      description: Error struct that includes the error, cause, reason, and possible resolutions. Check the full documentation [here](https://docs.payrails.com/docs/error-codes#error-structure).
                      required:
                        - id
                        - code
                        - detail
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Unique identifier of the error. Please use this value when reporting an issue to our team, so we can help you faster.
                        code:
                          type: string
                          description: Machine-friendly error code assigned to the error. Check the full list of possible values [here](https://docs.payrails.com/docs/error-codes#list-of-error-codes).
                        detail:
                          type: string
                          description: Human-readable description about the error, its cause, and resolution.
                        docUrl:
                          type: string
                          description: Link to the specific documentation about this particular `code`.
                        reason:
                          type: object
                          additionalProperties: true
                          description: Metadata providing more details about the reason of the error. The structure of this object varies according to the `code`.
              example:
                errors:
                  - id: a24bc325-3929-4d9d-9c08-b3aa532685b7
                    code: request.malformed
                    detail: The request has malformed syntax
                    docUrl: https://docs.payrails.com/docs/error-codes#requestmalformed
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      description: Error struct that includes the error, cause, reason, and possible resolutions. Check the full documentation [here](https://docs.payrails.com/docs/error-codes#error-structure).
                      required:
