  /token/connections/{connectionId}/proxy:
    post:
      summary: Invoke an outbound proxy connection
      operationId: outboundConnectionInvocation
      security: []
      description: |
        Proxies an outbound request to the destination using the provided headers. Please note that you can configure
        connection using any of HTTP methods, not only POST.
      tags:
        - Vault Proxy Connections
      parameters:
        - name: connectionId
          in: path
          description: Identifier of the resource in Payrails.
          required: true
          schema:
            type: string
            format: uuid
          example: d5454c2f-ae5e-44f3-8edf-f6dad64f005f
        - name: Payrails-Authorization
          description: The Payrails authorization token generated using the client ID and secret.
          in: header
          required: true
          schema:
            type: string
            example: Bearer abc123
        - name: Payrails-Destination
          description: The destination URL to be proxied after being processed by Payrails. Ensure that the domain is whitelisted in the connection settings via the portal.
          in: header
          required: true
          schema:
            type: string
            description: Target endpoint URL.
            example: https://your-partner.com/api/some-api-endpoint
      requestBody:
        required: true
        content:
          application/json:
            examples:
              jsonExample:
                summary: Example JSON card data
                value:
                  cards:
                    number: 9f7d2406-456d-401e-a77b-16b733d95414
                    securityCode: e211808e-316f-4877-9899-a2fa711d5fb7
                    expiryMonth: fe7a9af7-157f-4982-807d-ed32407e02fb
                    expiryYear: d1a373d4-e681-460b-b6a8-e57b8e029d40
          application/xml:
            examples:
              xmlExample:
                summary: Sample XML card request
                value: |
                  <cards>
                  <number>3441a2be-5252-4039-9066-8c6c8ad41514</number>
                  <securityCode>eabf5351-1a3c-418a-8221-698c1dd8867a</securityCode>
                  <expiryMonth>1ee8a8dc-3ef7-4383-92b7-7d00497458c0</expiryMonth>
                  <expiryYear>d3158d68-cabe-4b33-9df9-d13376533b2a</expiryYear>
                  </cards>
      responses:
        '200':
          description: |
            Returns the response from the destination URL.
            Although it was demonstrated to return raw data, the raw response is passed to the proxy merchant, which aligns with the real-world use case.
            In a real scenario, the merchant would not return actual card data — this is just a sample response to demonstrate the proxy use case.
          content:
            application/json:
              examples:
                jsonResponse:
                  summary: JSON card response
                  value:
                    cards:
                      number: '4111111111111111'
                      securityCode: '111'
                      expiryMonth: '01'
                      expiryYear: '35'
            application/xml:
              examples:
                xmlResponse:
                  summary: XML card response - redacted card data
                  value: |
                    <?xml version="1.0"?>
                    <cards>
                      <number>4111111111111111</number>
                      <securityCode>111</securityCode>
                      <expiryMonth>01</expiryMonth>
                      <expiryYear>35</expiryYear>
                    </cards>
        '413':
          description: Content Too Large.
          content:
            application/json:
              schema:
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      description: Error struct that includes the error, cause, reason, and possible resolutions. Check the full documentation [here](https://docs.payrails.com/docs/error-codes#error-structure).
                      required:
                        - id
                        - code
                        - detail
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Unique identifier of the error. Please use this value when reporting an issue to our team, so we can help you faster.
                        code:
                          type: string
                          description: Machine-friendly error code assigned to the error. Check the full list of possible values [here](https://docs.payrails.com/docs/error-codes#list-of-error-codes).
                        detail:
                          type: string
                          description: Human-readable description about the error, its cause, and resolution.
                        docUrl:
                          type: string
                          description: Link to the specific documentation about this particular `code`.
                        reason:
                          type: object
                          additionalProperties: true
                          description: Metadata providing more details about the reason of the error. The structure of this object varies according to the `code`.
              example:
                errors:
                  - id: a24bc325-3929-4d9d-9c08-b3aa532685b7
                    code: request.entity-too-large
                    detail: The request entity is too large
                    docUrl: https://docs.payrails.com/docs/error-codes#requestentity-too-large
