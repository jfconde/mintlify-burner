  /token/connections/{connectionId}/versions:
    post:
      summary: Create a new version of a connection
      operationId: createVaultConnectionVersions
      description: |
        Saves the connection version data and returns connection version with ID.
      security:
        - BearerToken:
            - vaultconnectionversions:create
      tags:
        - Vault Proxy Connections
      parameters:
        - name: connectionId
          in: path
          required: true
          description: Parameter connectionId is required for which connection version is created.
          schema:
            type: string
      requestBody:
        description: The connection version data that need to be saved for connectionId.
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of connection version.
                  example: Fetch reservations
                description:
                  type: string
                  description: Description of connection version.
                  example: Get all reservations
                httpMethods:
                  type: array
                  description: |
                    HTTP Methods this connection should be invoked by. You can create different connections that are
                    invoked using same URL but which should behave differently depending on method. For example,
                    there can be connection version that handles requests for "GET /orders" and another connection
                    that handles requests for "POST /orders".
                  example:
                    - POST
                    - PATCH
                  items:
                    type: string
                    enum:
                      - GET
                      - POST
                      - PUT
                      - DELETE
                      - PATCH
                publicUrl:
                  type: string
                  description: Public url that will be invoked by third party or merchant.
                  example: /v1/reservations
                anyOf:
                  type: object
                  properties:
                    proxyUrl:
                      type: string
                      description: |
                        The proxy URL is primarily the URL where requests are forwarded after tokenization or de-tokenization. It applies to inbound connections.
                      example: https://merchant.com/v2/reservations
                    trustedDestinationHosts:
                      type: array
                      description: |
                        The destination hosts are a list of whitelisted hosts to which outbound connections can be proxied.
                      items:
                        type: string
                      example:
                        - stripe.com
                        - example.com
                rules:
                  type: array
                  items:
                    anyOf:
                      - title: Card tokenization
                        type: object
                        properties:
                          action:
                            type: string
                            title: Action of this rule.
                            description: The action required by this rule. Examples of actions include tokenization and detokenization.
                            enum:
                              - tokenization
                            example: tokenization
                          config:
                            type: object
                            allOf:
                              - type: object
                                required:
                                  - targetContentType
                                  - targetRecordType
                                  - fields
                                properties:
                                  targetRecordType:
                                    type: string
                                    title: RecordType that has to be tokenized.
                                    enum:
                                      - card
                                      - networkToken
                                    description: RecordType that has to be parsed and tokenized from Payload.
                                    example: networkToken
                                  targetContentType:
                                    type: string
                                    title: ContentType of target payload.
                                    description: ContentType of target payload that need to be parsed.
                                    example: xml
                                    enum:
                                      - xml
                                      - json
                                      - formurlencoded
                                      - xmlformurlencoded
                                  expiresIn:
                                    type: integer
                                    title: Record Expiry Duration in Seconds.
                                    description: ExpiresIn refers to the duration in seconds or time remaining before a record becomes invalid or deleted.
                                    example: 5000
                                  recordSelector:
                                    type: string
                                    title: Record selector
                                    description: XPath or JSONPath selector for parsing specified record.
                                    example: /networkToken
                              - type: object
                                properties:
                                  fields:
                                    type: object
                                    required:
                                      - cardNumber
                                      - expiryMonth
                                      - expiryYear
                                    properties:
                                      cardNumber:
                                        title: Card number
                                        description: Rule for parsing cardNumber from Payload.
                                        type: object
                                        required:
                                          - fieldSelector
                                          - aliasFormat
                                        allOf:
                                          - required:
                                              - fieldSelector
                                              - storagePolicy
                                              - aliasFormat
                                            allOf:
                                              - required:
                                                  - fieldSelector
                                                properties:
                                                  fieldRegex:
                                                    title: Field regex
                                                    description: |
                                                      After a field is selected, specify how it should be stored or retrieved. You can use a regex expression to parse the field.
                                                      For example, if a card number contains dashes in the payload and you need to remove them, you can use a regex expression to do so.
                                                    nullable: true
                                                    type:
                                                      - string
                                                  fieldSelector:
                                                    title: field selector
                                                    description: Allows to parse the field from request or response payload.
                                                    minLength: 1
                                                    type: string
                                                type: object
                                              - type: object
                                                properties:
                                                  aliasFormat:
                                                    title: Alias format
                                                    default: keepOriginal
                                                    enum:
                                                      - uuid
                                                      - keepOriginal
                                                    type: string
                                                  displayFormat:
                                                    title: Display format
                                                    nullable: true
                                                    type: string
                                                  replacementFormat:
                                                    title: Replacement format
                                                    description: |
                                                      Defines with what value the field should be replaced with. By default or when replaceWithAlias selected,
                                                      the tokenized value is replaced with its alias. When replaceWithDisplayableValue selected, the field
                                                      value is replaced with its displayable value.
                                                    nullable: true
                                                    type: string
                                                    enum:
                                                      - replaceWithAlias
                                                      - replaceWithDisplayableValue
                                                  storagePolicy:
                                                    title: Storage policy
                                                    default: permanent
                                                    enum:
                                                      - permanent
                                                      - volatile
                                                    type: string
                                          - type: object
                                            properties:
                                              aliasFormat:
                                                title: Alias format
                                                description: Alias format on how merchant receive this field.
                                                default: uuid
                                                enum:
                                                  - uuid
                                                  - binTFourAlphanumeric
                                                type: string
                                              displayFormat:
                                                title: Display format
                                                description: Display format on how this field we will displayed post tokenization.
                                                default: last4
                                                enum:
                                                  - last4
                                                type: string
                                              storagePolicy:
                                                title: Storage policy
                                                description: Storage policy for this field in vault.
                                                default: permanent
                                                enum:
                                                  - permanent
                                                type: string
                                      securityCode:
                                        title: Security code
                                        description: Rule for parsing securityCode from Payload.
                                        required:
                                          - fieldSelector
                                          - storagePolicy
                                          - aliasFormat
                                        properties:
                                          aliasFormat:
                                            title: Alias format
                                            description: Alias format on how merchant receive this field.
                                            default: uuid
                                            enum:
                                              - uuid
                                            type: string
                                          storagePolicy:
                                            title: Storage policy
                                            description: Storage policy for this field in vault.
                                            default: volatile
                                            enum:
                                              - volatile
                                            type: string
                                        type: object
                                      expiryMonth:
                                        required:
                                          - fieldSelector
                                          - storagePolicy
                                          - aliasFormat
                                        allOf:
                                          - required:
