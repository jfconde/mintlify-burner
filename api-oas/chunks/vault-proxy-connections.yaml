                      - title: Custom function
                        description: Function that executed as part of this rule.
                        type: object
                        properties:
                          action:
                            type: string
                            title: Action of this rule.
                            description: The action required by this rule. Examples of actions include tokenization and detokenization.
                            enum:
                              - customFunction
                            example: customFunction
