                        detail:
                          type: string
                          description: Human-readable description about the error, its cause, and resolution.
                        docUrl:
                          type: string
                          description: Link to the specific documentation about this particular `code`.
                        reason:
                          type: object
                          additionalProperties: true
                          description: Metadata providing more details about the reason of the error. The structure of this object varies according to the `code`.
              example:
                errors:
                  - id: e7db22b3-914e-4975-928e-9edfb0885bea
                    code: request.forbidden
                    detail: The request credentials lack the required permissions to perform the specified action
                    docUrl: https://docs.payrails.com/docs/error-codes#requestforbidden
    get:
      summary: Filter & list connections
      operationId: listConnections
      description: |
        Fetch list of connections for given query parameters.
        By default, deleted connections are excluded from the results.
      security:
        - BearerToken:
            - vaultconnections:read
      tags:
        - Vault Proxy Connections
      parameters:
        - name: filter[connectionType]
          in: query
          schema:
            type: string
            enum:
              - inbound
              - outbound
          description: Filter for a list of connections by connectionType.
        - name: filter[live]
          in: query
          schema:
            type: boolean
          description: Filter connections based on their live status.
        - name: filter[searchTerm]
          in: query
          schema:
            type: string
          description: Filter connections based on a partial or full match in their ID, name, or description.
        - name: filter[includeDeleted]
          in: query
          schema:
            type: boolean
            default: false
          description: When set to true, includes deleted connections in the results. Default is false.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  paging:
                    type: object
                    description: Paging information about the results.
                    properties:
                      next:
                        type: string
                  results:
                    type: array
                    description: List of results for the query.
                    items:
                      title: Connection object
                      allOf:
                        - type: object
                          properties:
                            name:
                              type: string
                              description: Name of the connection.
                            description:
                              type: string
                              description: |
                                Description of the connection.
                            connectionType:
                              type: string
                              description: |
                                Defines the category of the connection. Once a connection is created, this value is fixed and cannot be modified.
                                You can find more information about types of connections [in guide](https://docs.payrails.com/docs/proxy-connections).
                              enum:
