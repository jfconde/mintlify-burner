  /token/connections/{connectionId}/versions/live:
    put:
      summary: Set live version of a connection
      operationId: setLiveVersion
      description: |
        Set certain version of connection as live version or deactivates connection by removing current live version.
      security:
        - BearerToken:
            - vaultconnectionversions:setlive
      tags:
        - Vault Proxy Connections
      parameters:
        - name: connectionId
          in: path
          description: Identifier of the resource in Payrails.
          required: true
          schema:
            type: string
            format: uuid
          example: d5454c2f-ae5e-44f3-8edf-f6dad64f005f
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
