                          description: Metadata providing more details about the reason of the error. The structure of this object varies according to the `code`.
              example:
                errors:
                  - id: a24bc325-3929-4d9d-9c08-b3aa532685b7
                    code: request.not-found
                    detail: The requested resource was not found
                    docUrl: https://docs.payrails.com/docs/error-codes#requestnot-found
  /analytics/reports/{reportId}:
    get:
      summary: Get a report by ID
      operationId: getReport
      description: Get a report by ID.
      security:
        - BearerToken:
            - reports:read
      tags:
        - Reports
      parameters:
        - name: reportId
          in: path
          description: Identifier of the resource in Payrails.
          required: true
          schema:
            type: string
            format: uuid
          example: d5454c2f-ae5e-44f3-8edf-f6dad64f005f
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - code
                  - name
                  - description
