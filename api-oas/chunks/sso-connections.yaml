  /auth/sso/connections/saml-configs:
    get:
      summary: Get SAML IdP configuration values
      operationId: listSamlConnectionConfigs
      description: Retrieve configuration values required to connect supported SAML identity providers for the active merchant.
      tags:
        - SSO Connections
      security:
        - BearerToken:
            - ssoconnections:read
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                description: Array of predefined SAML Identity Provider (IdP) connection configuration templates (AudienceURI, CallbackURL) used to bootstrap merchant SSO setup.
                type: array
                items:
                  type: object
                  description: Configuration details needed to set up a SAML identity provider connection in Auth0.
                  required:
                    - Name
                    - DisplayName
                    - AudienceURI
                    - CallbackURL
                  properties:
                    Name:
                      type: string
                      description: Provider key configured for the SAML connection.
                    DisplayName:
                      type: string
                      description: Human-readable label shown to end users.
                    AudienceURI:
                      type: string
                      format: uri
                      description: Audience URI that must be configured in the identity provider.
                    CallbackURL:
                      type: string
                      format: uri
                      description: Callback URL to register in the identity provider for SAML assertions.
              example:
                - Name: okta
                  DisplayName: Okta
                  AudienceURI: urn:auth0:payrails-staging:acme-saml-okta
                  CallbackURL: https://auth.payrails.io/login/callback?connection=acme-saml-okta&organization=org_123456789
                - Name: jumpcloud
                  DisplayName: JumpCloud
                  AudienceURI: urn:auth0:payrails-staging:acme-saml-jumpcloud
                  CallbackURL: https://auth.payrails.io/login/callback?connection=acme-saml-jumpcloud&organization=org_123456789
