openapi: 3.1.0
info:
  version: 1.3.15
  title: Payrails API Reference
  contact:
    name: Payrails
    url: https://www.payrails.com
    email: tech@payrails.com
  license:
    name: Payrails GmbH
    url: https://www.payrails.com/
  description: |
    ---
    Payrails provides a collection of APIs that enable you to process and manage payments. Our APIs accept and return JSON in the HTTP body, and return standard HTTP response codes. You can consume the APIs directly using your favorite HTTP/REST library.
servers:
  - url: https://api.staging.payrails.io
    description: Payrails environment.
security:
  - ApiKey: []
tags:
  - name: SSO Connections
    description: Operations related to managing SSO identity provider connections.
paths:
  /auth/sso/connections:
    post:
      summary: Create SSO connection
      operationId: createSsoConnection
      description: Create a new SSO identity provider connection.
      tags:
        - SSO Connections
      security:
        - BearerToken:
            - ssoconnections:create
      parameters:
        - name: x-idempotency-key
          in: header
          description: |
            Idempotency key to be used.
            Sending again the same key would return the same result without re-executing the update.
          required: true
          schema:
            type: string
            format: uuid
          example: 91874e4d-81e9-4486-aee4-ee1de84da890
        - name: Content-Type
          in: header
          description: Content Type key to indicate the original media type of the resource.
          required: true
          schema:
            type: string
          example: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - provider
                - metadata
              properties:
                type:
                  type: string
                  enum:
                    - SAML
                  description: Identity provider connection type.
                provider:
                  description: Allowed SSO providers.
                  type: string
                  enum:
                    - auth0
                    - jumpcloud
                    - microsoft
                    - okta
                metadata:
                  description: Provider-specific metadata required to establish the connection.
                  type: object
                  required:
                    - saml
                  properties:
                    saml:
                      description: SAML-specific metadata for the identity provider connection.
                      type: object
                      required:
                        - samlMetadataURL
                      properties:
                        samlMetadataURL:
                          type: string
                          format: uri
                          description: HTTPS URL referencing the SAML metadata document.
            example:
              type: SAML
              provider: okta
              metadata:
                saml:
                  samlMetadataURL: https://sso.okta.com/saml2/metadata/xyzx123yz
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                description: Identity provider connection managed by the SSO service.
                required:
                  - id
                  - reference
                  - type
                  - status
                  - metadata
                  - name
                  - displayName
                  - provider
                  - createdAt
                  - updatedAt
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Unique identifier of the SSO connection.
                  reference:
                    type: string
                    description: Identifier assigned by the downstream identity provider.
                  type:
                    type: string
                    description: Identity provider connection type.
                    enum:
                      - SAML
                  status:
                    type: string
                    description: Lifecycle status of the connection.
                    enum:
                      - enabled
                      - disabled
                  metadata:
                    type: object
                    required:
                      - saml
                    properties:
                      saml:
                        description: SAML-specific metadata for the identity provider connection.
                        type: object
                        required:
                          - samlMetadataURL
                        properties:
                          samlMetadataURL:
                            type: string
                            format: uri
                            description: HTTPS URL referencing the SAML metadata document.
                  name:
                    type: string
                    description: Internal name assigned to the connection.
                  displayName:
                    type: string
                    description: Display label returned to clients initiating SSO.
                  provider:
                    description: Allowed/Supported SSO providers.
                    type: string
                    enum:
                      - auth0
                      - jumpcloud
                      - microsoft
                      - okta
                  createdAt:
                    type: string
                    format: date-time
                    description: ISO-8601 timestamp when the connection was created.
                  updatedAt:
                    type: string
                    format: date-time
                    description: ISO-8601 timestamp when the connection was last updated.
              example:
                id: 88c9db51-4dbf-4ee0-9a9c-1f9fd2f6d0ef
                reference: saml-connection-123
                type: SAML
                status: enabled
                metadata:
                  saml:
                    samlMetadataURL: https://sso.okta.com/app/exk123/sso/saml/metadata
                    rawSamlMetadataXMLString: <xml>...</xml>
                name: payrails-saml-okta
                displayName: payrails-saml-okta
                provider: okta
                createdAt: '2024-07-12T10:23:45Z'
                updatedAt: '2024-07-12T10:35:02Z'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      description: Error struct that includes the error, cause, reason, and possible resolutions. Check the full documentation [here](https://docs.payrails.com/docs/error-codes#error-structure).
                      required:
                        - id
                        - code
                        - detail
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Unique identifier of the error. Please use this value when reporting an issue to our team, so we can help you faster.
                        code:
