    patch:
      summary: Update SSO connection
      operationId: patchSSOConnection
      description: Update the status or metadata of an existing SSO identity provider connection.
      tags:
        - SSO Connections
      security:
        - BearerToken:
            - ssoconnections:update
      parameters:
        - name: x-idempotency-key
          in: header
          description: |
            Idempotency key to be used.
            Sending again the same key would return the same result without re-executing the update.
          required: true
          schema:
            type: string
            format: uuid
          example: 91874e4d-81e9-4486-aee4-ee1de84da890
        - name: Content-Type
          in: header
          description: Content Type key to indicate the original media type of the resource.
          required: true
          schema:
            type: string
          example: application/json
        - name: connectionId
          in: path
          description: Unique identifier of the SSO connection.
          required: true
          schema:
            type: string
            format: uuid
          example: 88c9db51-4dbf-4ee0-9a9c-1f9fd2f6d0ef
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Fields that can be updated for an existing SSO identity provider connection.
              properties:
                status:
                  type: string
                  description: Lifecycle status of the connection.
                  enum:
                    - enabled
                    - disabled
                metadata:
                  type: object
                  required:
                    - saml
                  properties:
                    saml:
                      description: SAML-specific metadata for the identity provider connection.
                      type: object
                      required:
                        - samlMetadataURL
                      properties:
                        samlMetadataURL:
                          type: string
                          format: uri
                          description: HTTPS URL referencing the SAML metadata document.
                  description: Provider-specific metadata required to refresh connection configuration.
              anyOf:
                - title: Status Update
                  description: Patch only the lifecycle status of the connection.
                  required:
                    - status
                - title: Metadata Update
                  description: Patch only the provider-specific metadata.
                  required:
                    - metadata
                - title: Metadata And Status Update
                  description: Patch both lifecycle status and provider metadata in a single request.
                  required:
                    - metadata
                    - status
            example:
              status: disabled
              metadata:
                saml:
                  samlMetadataURL: https://sso.okta.com/app/exk123/sso/saml/metadata
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                description: Identity provider connection managed by the SSO service.
                required:
                  - id
                  - reference
                  - type
                  - status
                  - metadata
                  - name
                  - displayName
                  - provider
                  - createdAt
                  - updatedAt
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Unique identifier of the SSO connection.
                  reference:
                    type: string
                    description: Identifier assigned by the downstream identity provider.
                  type:
                    type: string
                    description: Identity provider connection type.
                    enum:
                      - SAML
                  status:
                    type: string
                    description: Lifecycle status of the connection.
                    enum:
                      - enabled
                      - disabled
                  metadata:
                    type: object
                    required:
                      - saml
                    properties:
                      saml:
                        description: SAML-specific metadata for the identity provider connection.
                        type: object
                        required:
                          - samlMetadataURL
                        properties:
                          samlMetadataURL:
                            type: string
                            format: uri
                            description: HTTPS URL referencing the SAML metadata document.
                  name:
                    type: string
                    description: Internal name assigned to the connection.
                  displayName:
                    type: string
                    description: Display label returned to clients initiating SSO.
                  provider:
                    description: Allowed/Supported SSO providers.
                    type: string
                    enum:
                      - auth0
                      - jumpcloud
                      - microsoft
