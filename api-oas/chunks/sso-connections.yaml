    get:
      summary: List SSO connections
      operationId: listSSOConnections
      description: Retrieve SSO identity provider connections using optional filters and cursor-based pagination.
      tags:
        - SSO Connections
      security:
        - BearerToken:
            - ssoconnections:list
      parameters:
        - name: filter[id]
          in: query
          description: Filter by connection ID (comma-separated UUID values).
          schema:
            type: string
        - name: filter[reference]
          in: query
          description: Filter by the downstream provider reference.
          schema:
            type: string
        - name: filter[type]
          in: query
          description: Filter by connection type.
          schema:
            type: string
            enum:
              - SAML
        - name: filter[status]
          in: query
          description: Filter by connection lifecycle status.
          schema:
            type: string
            enum:
              - enabled
              - disabled
        - name: filter[provider]
          in: query
          description: Filter by configured SSO provider key.
          schema:
            type: string
            enum:
              - auth0
              - jumpcloud
              - microsoft
              - okta
        - name: page[cursor]
          in: query
          description: Search collection items from that cursor.
          required: false
          schema:
            type: string
            description: Cursor for paging results.
          example: 9wkueqcavq
        - name: page[after]
          in: query
          description: Search collection items after that cursor.
          required: false
          schema:
            type: string
            description: Cursor for paging results.
          example: xk2h55zsy5
        - name: page[before]
          in: query
          description: Search collection items before that cursor.
          required: false
          schema:
            type: string
            description: Cursor for paging results.
          example: 9wkueqcavq
        - name: page[size]
          in: query
          description: Length of the collection to search.
          required: false
          schema:
            type: integer
            format: int32
          example: 20
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - results
                  - links
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      description: Identity provider connection managed by the SSO service.
                      required:
                        - id
                        - reference
                        - type
                        - status
                        - metadata
                        - name
                        - displayName
                        - provider
                        - createdAt
                        - updatedAt
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Unique identifier of the SSO connection.
                        reference:
                          type: string
                          description: Identifier assigned by the downstream identity provider.
                        type:
                          type: string
                          description: Identity provider connection type.
                          enum:
                            - SAML
                        status:
                          type: string
                          description: Lifecycle status of the connection.
                          enum:
                            - enabled
                            - disabled
                        metadata:
                          type: object
                          required:
                            - saml
                          properties:
                            saml:
                              description: SAML-specific metadata for the identity provider connection.
                              type: object
                              required:
                                - samlMetadataURL
                              properties:
                                samlMetadataURL:
                                  type: string
                                  format: uri
                                  description: HTTPS URL referencing the SAML metadata document.
                        name:
                          type: string
                          description: Internal name assigned to the connection.
                        displayName:
                          type: string
                          description: Display label returned to clients initiating SSO.
                        provider:
                          description: Allowed/Supported SSO providers.
                          type: string
                          enum:
                            - auth0
                            - jumpcloud
                            - microsoft
                            - okta
                        createdAt:
                          type: string
                          format: date-time
                          description: ISO-8601 timestamp when the connection was created.
                        updatedAt:
                          type: string
                          format: date-time
                          description: ISO-8601 timestamp when the connection was last updated.
                  links:
                    required:
                      - self
                    properties:
                      self:
                        type: string
                      prev:
                        type: string
                      next:
                        type: string
                      first:
                        type: string
                      last:
                        type: string
              example:
                results:
                  - id: 88c9db51-4dbf-4ee0-9a9c-1f9fd2f6d0ef
                    reference: saml-connection-123
                    type: SAML
                    status: enabled
                    metadata:
                      saml:
                        samlMetadataURL: https://sso.okta.com/app/exk123/sso/saml/metadata
                        rawSamlMetadataXMLString: <xml>...</xml>
                    name: payrails-saml-okta
                    displayName: payrails-saml-okta
                    provider: okta
                    createdAt: '2024-07-12T10:23:45Z'
                    updatedAt: '2024-07-12T10:35:02Z'
                links:
                  self: /auth/sso/connections?page[size]=10
