  /token/records/fields:
    get:
      summary: Get field details by alias list
      operationId: fieldsInfoByAliases
      description: |
        Get field details for multiple provided aliases. The order in which aliases returned may not match the order in
        which you passed the aliases in request. Not found fields will be ignored: if you request fields by aliases
        a, b, c and there is no field with alias b, then only fields a and c are returned.
      security:
        - BearerToken:
            - vaultrecords:meta:read
      tags:
        - Vault Records and Aliases
      parameters:
        - name: aliases
          in: query
          description: |
            Comma-separated aliases of fields in Payrails Vault. There should be at least one alias provided
            and in one call you can provide up to 10 aliases.
          required: true
          schema:
            type: string
          example: 04a5b266-37c2-45e1-8729-04170b43b808,26ee17ee-a478-40f4-b1f3-49cf8ae9dff6
        - name: includeVolatileInfo
          in: query
          schema:
            type: boolean
            default: false
          description: Boolean indicating if additional information regarding volatile fields should be included in the response.
        - name: includeDetokenizations
          in: query
          schema:
            type: boolean
            default: false
          description: Boolean indicating if additional information regarding performed detokenization attempts should be returned.
      responses:
