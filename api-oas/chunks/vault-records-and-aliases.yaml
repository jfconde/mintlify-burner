openapi: 3.1.0
info:
  version: 1.3.15
  title: Payrails API Reference
  contact:
    name: Payrails
    url: https://www.payrails.com
    email: tech@payrails.com
  license:
    name: Payrails GmbH
    url: https://www.payrails.com/
  description: |
    ---
    Payrails provides a collection of APIs that enable you to process and manage payments. Our APIs accept and return JSON in the HTTP body, and return standard HTTP response codes. You can consume the APIs directly using your favorite HTTP/REST library.
servers:
  - url: https://api.staging.payrails.io
    description: Payrails environment.
security:
  - ApiKey: []
tags:
  - name: Vault Records and Aliases
    description: Operations related to managing records and aliases.
paths:
  /token/records/fields/{alias}:
    get:
      summary: Get field details by alias
      operationId: fieldByAlias
      description: |
        Get field details for the given alias.
      security:
        - BearerToken:
            - vaultrecords:meta:read
      tags:
        - Vault Records and Aliases
      parameters:
        - name: alias
          in: path
          description: Alias of the record's field in Payrails Vault.
          required: true
          schema:
            type: string
          example: 04a5b266-37c2-45e1-8729-04170b43b808
        - name: includeVolatileInfo
          in: query
          schema:
            type: boolean
            default: false
          description: Boolean indicating if additional information regarding volatile fields should be included in the response.
        - name: includeDetokenizations
          in: query
          schema:
            type: boolean
            default: false
          description: Boolean indicating if additional information regarding performed detokenization attempts should be returned.
      responses:
        '200':
          description: Details about field.
          content:
            application/json:
              schema:
                type: object
                title: Field object
                properties:
                  alias:
                    type: string
                    description: Merchant-facing unique alias for the field. Used as an identifier.
                  recordId:
                    type: string
                    description: Identifier of the record to which the alias belongs.
                  recordType:
                    type: string
                    description: Record type to which this field belongs, e.g. `card` and `networkToken`.
                  fieldType:
                    type: string
                    description: |
                      Field type of the alias, e.g. `cardNumber`, `expiryMonth`,
                      `expiryYear`, `securityCode`, `holderName`, `networkToken`, `cryptogram`.
                  displayableValue:
                    type: string
                    nullable: true
                    description: Displayable value for the field.
                  allowedDetokenizationCount:
                    type: integer
                    nullable: true
                    title: Allowed detokenization count.
                    description: It will be restricted if used on a proxy and reaches the limit mentioned in this field.
                    example: 0
                  allowedSdkRevealCount:
                    type: integer
                    nullable: true
                    title: Allowed reveal count.
                    description: It will be restricted if used on a SDK reveal and reaches the limit mentioned in this field.
                    example: 0
                  hasValue:
                    type: boolean
                    nullable: true
                    title: Whether volatile field has value.
                    description: Indicates whether the volatile field has a value associated with it. If false or not present, the field has been deleted or was never set.
                  maximumExpirationDate:
                    type: string
                    nullable: true
                    format: date-time
                    title: Maximum expiration date for volatile field.
                    description: The maximum expiration date for the volatile field value. After this date, the field value will be deleted. Please note that depending on usage of volatile field, value can be deleted even earlier, for example if allowed detokenization or reveal counts are exceeded, or when you explicitly call delete operation on the field.
                    example: '2024-12-31T23:59:59Z'
                  detokenizations:
                    type: array
                    nullable: true
                    title: Detokenization attempts.
                    description: List of detokenization attempts performed on this field. This field is returned only when requested via `includeDetokenizations` query parameter.
                    items:
                      type: object
                      properties:
                        lastAttemptedAt:
                          type: string
                          format: date-time
                          description: Timestamp when the detokenization was attempted.
                          example: '2024-01-01T12:00:00Z'
                        count:
                          type: integer
                          description: Number of times this type of detokenization was successfully performed.
                          example: 1
                        type:
                          type: string
                          description: Type of detokenization attempt. `detokenization` indicates a standard detokenization, while `sdkReveal` indicates a detokenization performed via SDK reveal.
                          example: detokenization
                          enum:
                            - detokenization
                            - sdkReveal
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      description: Error struct that includes the error, cause, reason, and possible resolutions. Check the full documentation [here](https://docs.payrails.com/docs/error-codes#error-structure).
                      required:
                        - id
                        - code
                        - detail
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Unique identifier of the error. Please use this value when reporting an issue to our team, so we can help you faster.
                        code:
                          type: string
                          description: Machine-friendly error code assigned to the error. Check the full list of possible values [here](https://docs.payrails.com/docs/error-codes#list-of-error-codes).
                        detail:
                          type: string
                          description: Human-readable description about the error, its cause, and resolution.
                        docUrl:
                          type: string
                          description: Link to the specific documentation about this particular `code`.
                        reason:
                          type: object
                          additionalProperties: true
                          description: Metadata providing more details about the reason of the error. The structure of this object varies according to the `code`.
              example:
                errors:
                  - id: a24bc325-3929-4d9d-9c08-b3aa532685b7
                    code: request.unauthorized
                    detail: The request lacks necessary credentials to perform the specified action
                    docUrl: https://docs.payrails.com/docs/error-codes#requestunauthorized
        '403':
          description: Insufficient Scope.
          content:
            application/json:
              schema:
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      description: Error struct that includes the error, cause, reason, and possible resolutions. Check the full documentation [here](https://docs.payrails.com/docs/error-codes#error-structure).
                      required:
                        - id
